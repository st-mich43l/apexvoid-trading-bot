name: apexvoid-trading-bot

# Local/dev compose. Secrets and shared cTrader ENV live in `.env`.
#
# Configuration V3 (docs/configuration.md): `bot`'s non-secret tuning now
# comes entirely from config/apexvoid.demo-eval.yml (the categorized
# config/*.yml files + config/environments/demo_eval.yml, mounted whole
# below) — not `config/trading-bot.yml`, and not any of the ENV tuning
# variables this file used to set (AUTO_TRADE_PROFILE/
# AUTO_TRADE_MAPPED_ZONE_ENABLED/AUTO_TRADE_MARKET_MAP_GUARD_ENABLED/
# LOG_DIR/LOG_RETENTION_DAYS/LOG_FILE_ENABLED all removed from `bot`'s own
# environment — see docs/configuration-v3-migration-audit.md's Stage C3
# section for the parity proof and one real, well-evidenced behavior
# fix this cutover produces for local/dev specifically: those ENV
# defaults, and trading-bot.yml's own explicit values, were silently
# defeating several of the demo_eval profile's own intended overrides
# (config-file/process-env precedence beating the profile layer) —
# config/environments/demo_eval.yml is now the one place that intent is
# expressed, and nothing outranks it anymore.
#
# `config-compiler` and `ctrader-engine` are UNCHANGED — .NET still reads
# ResolvedRuntimeManifest (compiled from config/trading-bot.yml) until
# Stage C5 gives it a direct YAML reader too; trading-bot.yml therefore
# remains live for that path only, not read by `bot` anymore.

services:
  postgres:
    image: postgres:17-alpine
    container_name: apexvoid-trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apexvoid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexvoid}
      POSTGRES_DB: ${POSTGRES_DB:-signals}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexvoid} -d ${POSTGRES_DB:-signals}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No ports exposed — only the bot on the internal network reaches it.

  redis:
    image: redis:7-alpine
    container_name: apexvoid-trading-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # redisdata holds the rotated live cTrader refresh token; each rotation
    # invalidates the previous token. The host file mirror recovers Redis loss,
    # but destroying both requires manual cTrader Playground re-authorisation.

  kafka:
    image: apache/kafka:4.0.0
    container_name: apexvoid-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    build: ./analysis-engine
    image: apexvoid-analysis-engine:latest
    container_name: apexvoid-kafka-init
    restart: "no"
    environment:
      APEXVOID_CONFIG_FILE: /config/apexvoid.yml
    entrypoint: ["/app/kafka-admin"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config:/config:ro

  analysis-engine:
    build: ./analysis-engine
    image: apexvoid-analysis-engine:latest
    container_name: apexvoid-analysis-engine
    restart: unless-stopped
    environment:
      APEXVOID_CONFIG_FILE: /config/apexvoid.yml
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Startup order:
  #   postgres + redis → config-compiler → ctrader-engine → bot
  # ResolvedRuntimeManifest V2 is authoritative. ENV is secrets + bootstrap only.
  config-compiler:
    build: ./algo-bot
    image: apexvoid-trading-bot:latest
    container_name: apexvoid-config-compiler
    restart: "no"
    env_file: .env
    environment:
      APEXVOID_CONFIG_FILE: /config/trading-bot.yml
      APEXVOID_RUNTIME_MANIFEST_FILE: /runtime/resolved-runtime.json
    command:
      - python
      - -m
      - app.configuration.runtime_manifest_cli
      - --config-file
      - /config/trading-bot.yml
      - --output
      - /runtime/resolved-runtime.json
      - --check
    volumes:
      - ./config/trading-bot.yml:/config/trading-bot.yml:ro
      - runtime-config:/runtime

  ctrader-engine:
    build: ./ctrader-engine
    image: apexvoid-ctrader-engine:latest
    container_name: apexvoid-ctrader-engine
    restart: unless-stopped
    env_file: .env
    environment:
      APEXVOID_CONFIG_FILE: /config/apexvoid.yml
      LOG_DIR: ${LOG_DIR:-/var/log/apexvoid}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_FILE_NAME: ${CTRADER_LOG_FILE_NAME:-ctrader-engine.log}
      APEXVOID_RUNTIME_MANIFEST_FILE: /runtime/resolved-runtime.json
      CTRADER_CONFIGURATION_SOURCE: manifest
      CTRADER_MANIFEST_PARITY_MODE: off
    depends_on:
      redis:
        condition: service_healthy
      config-compiler:
        condition: service_completed_successfully
    volumes:
      - ./config:/config:ro
      - ./data/ctrader-token:/var/lib/apexvoid
      - ./logs/ctrader-engine:/var/log/apexvoid
      - runtime-config:/runtime:ro
    healthcheck:
      test: ["CMD", "/app/ctrader-feed", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      # Broker connect + historical backfill write the first heartbeat.
      start_period: 120s
    # No ports exposed — outbound cTrader TLS + internal Redis only.

  bot:
    build: ./algo-bot
    image: apexvoid-trading-bot:latest
    container_name: apexvoid-trading-bot
    restart: unless-stopped
    env_file: .env
    environment:
      APEXVOID_CONFIG_FILE: /config/apexvoid.demo-eval.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-compiler:
        condition: service_completed_successfully
      ctrader-engine:
        condition: service_healthy
    volumes:
      - ./config:/config:ro
      - ./data:/data   # calendar cache (ff_*.json) still persists here
      - ./logs/algo-bot:/var/log/apexvoid
    # No ports exposed — the bot uses outbound Telegram long-polling only.

volumes:
  pgdata:
  redisdata:
  runtime-config:
  kafkadata:
