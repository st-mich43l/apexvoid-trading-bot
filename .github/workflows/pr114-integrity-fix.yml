name: PR 114 integrity fix

on:
  push:
    branches:
      - fix/autotrade-execution-finality-fencing-lifecycle

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REAL_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/autotrade-execution-finality-fencing-lifecycle

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed integrity fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def patch_section(text: str, start: str, end: str, old: str, new: str, label: str) -> str:
              left = text.index(start)
              right = text.index(end, left)
              section = replace_once(text[left:right], old, new, label)
              return text[:left] + section + text[right:]

          # Redis candidate lease state machine.
          path = Path('ctrader-engine/src/RedisBarSink.cs')
          text = path.read_text()
          text = replace_once(
              text,
              """      if state == 'published' then
                if stream_event_id ~= '' and event_id and event_id ~= stream_event_id then
                  return false
                end
                return true
              end
              if state == 'processing' or state == 'broker_submitting' then""",
              """      if state == 'published'
                or state == 'retryable_error'
                or state == 'broker_outcome_unknown' then
                if stream_event_id ~= '' and event_id and event_id ~= stream_event_id then
                  return false
                end
                return true
              end
              if state == 'processing' or state == 'broker_submitting' then""",
              'recoverable candidate states',
          )
          text = patch_section(
              text,
              '  private const string CandidateTransitionScript = """',
              '  private const string CandidateCompleteScript = """',
              """    local token = string.match(current, '\"lease_token\"%s*:%s*\"([^\"]+)\"')
              local event_id = string.match(current, '\"stream_event_id\"%s*:%s*\"([^\"]+)\"')
              if token ~= lease_token then
                return 0
              end
              if stream_event_id ~= '' and event_id and event_id ~= stream_event_id then
                return 0
              end
              local record = '{\"candidate_id\":\"' .. candidate_id""",
              """    local token = string.match(current, '\"lease_token\"%s*:%s*\"([^\"]+)\"')
              local event_id = string.match(current, '\"stream_event_id\"%s*:%s*\"([^\"]+)\"')
              local current_candidate = string.match(current, '\"candidate_id\"%s*:%s*\"([^\"]+)\"')
              local state = string.match(current, '\"state\"%s*:%s*\"([^\"]+)\"')
              if current_candidate and current_candidate ~= candidate_id then
                return 0
              end
              if token ~= lease_token then
                return 0
              end
              if stream_event_id ~= '' and event_id ~= stream_event_id then
                return 0
              end
              if state ~= 'processing' and state ~= 'broker_submitting' then
                return 0
              end
              if new_state == 'broker_outcome_unknown' then
                local unknown = '{\"candidate_id\":\"' .. candidate_id
                  .. '\",\"stream_event_id\":'
                  .. (stream_event_id ~= '' and ('\"' .. stream_event_id .. '\"') or 'null')
                  .. ',\"state\":\"broker_outcome_unknown\",\"lease_token\":null,'
                  .. '\"lease_expires_at\":null,\"outcome\":null,\"updated_at\":'
                  .. now .. ',\"version\":1}'
                redis.call('SET', KEYS[1], unknown, 'EX', 604800)
                return 1
              end
              local record = '{\"candidate_id\":\"' .. candidate_id""",
              'fenced candidate transition',
          )
          text = patch_section(
              text,
              '  private const string CandidateCompleteScript = """',
              '  private const string CandidateReleaseScript = """',
              """    local token = string.match(current, '\"lease_token\"%s*:%s*\"([^\"]+)\"')
              local event_id = string.match(current, '\"stream_event_id\"%s*:%s*\"([^\"]+)\"')
              if token and token ~= lease_token then
                return 0
              end
              if stream_event_id ~= '' and event_id and event_id ~= stream_event_id then
                return 0
              end
              local state = 'completed'""",
              """    local token = string.match(current, '\"lease_token\"%s*:%s*\"([^\"]+)\"')
              local event_id = string.match(current, '\"stream_event_id\"%s*:%s*\"([^\"]+)\"')
              local current_candidate = string.match(current, '\"candidate_id\"%s*:%s*\"([^\"]+)\"')
              local current_state = string.match(current, '\"state\"%s*:%s*\"([^\"]+)\"')
              local administrative_flip = lease_token == '' and string.sub(candidate_id, 1, 5) == 'flip:'
              if not administrative_flip then
                if current_candidate and current_candidate ~= candidate_id then
                  return 0
                end
                if token ~= lease_token then
                  return 0
                end
                if stream_event_id ~= '' and event_id ~= stream_event_id then
                  return 0
                end
                if current_state ~= 'processing' and current_state ~= 'broker_submitting' then
                  return 0
                end
              end
              local state = 'completed'""",
              'fenced candidate completion',
          )
          text = patch_section(
              text,
              '  private const string CandidateReleaseScript = """',
              '  private StackExchangeRedisSeriesCommands(',
              """    local token = string.match(current, '\"lease_token\"%s*:%s*\"([^\"]+)\"')
              local event_id = string.match(current, '\"stream_event_id\"%s*:%s*\"([^\"]+)\"')
              if token ~= lease_token then
                return 0
              end
              if stream_event_id ~= '' and event_id and event_id ~= stream_event_id then
                return 0
              end
              local record = '{\"candidate_id\":\"' .. candidate_id""",
              """    local token = string.match(current, '\"lease_token\"%s*:%s*\"([^\"]+)\"')
              local event_id = string.match(current, '\"stream_event_id\"%s*:%s*\"([^\"]+)\"')
              local current_candidate = string.match(current, '\"candidate_id\"%s*:%s*\"([^\"]+)\"')
              local state = string.match(current, '\"state\"%s*:%s*\"([^\"]+)\"')
              if current_candidate and current_candidate ~= candidate_id then
                return 0
              end
              if token ~= lease_token then
                return 0
              end
              if stream_event_id ~= '' and event_id ~= stream_event_id then
                return 0
              end
              if state == 'broker_submitting' then
                local unknown = '{\"candidate_id\":\"' .. candidate_id
                  .. '\",\"stream_event_id\":'
                  .. (stream_event_id ~= '' and ('\"' .. stream_event_id .. '\"') or 'null')
                  .. ',\"state\":\"broker_outcome_unknown\",\"lease_token\":null,'
                  .. '\"lease_expires_at\":null,\"outcome\":null,\"updated_at\":'
                  .. now .. ',\"version\":1}'
                redis.call('SET', KEYS[1], unknown, 'EX', 604800)
                return 1
              end
              if state ~= 'processing' then
                return 0
              end
              local record = '{\"candidate_id\":\"' .. candidate_id""",
              'durable broker uncertainty',
          )
          text = replace_once(
              text,
              """    await _db.ScriptEvaluateAsync(
                CandidateCompleteScript,
                [CandidateKey(candidateId)],
                [streamEventId, leaseToken, outcome, now, candidateId]
              );""",
              """    var result = await _db.ScriptEvaluateAsync(
                CandidateCompleteScript,
                [CandidateKey(candidateId)],
                [streamEventId, leaseToken, outcome, now, candidateId]
              );
              if ((long)result != 1)
              {
                throw new InvalidOperationException(
                  $\"candidate completion lost lease candidate={candidateId}\"
                );
              }""",
              'check completion result',
          )
          path.write_text(text)

          path = Path('ctrader-engine/src/CandidateExecutionRecord.cs')
          text = path.read_text()
          text = replace_once(
              text,
              """      return State;""",
              """      return State is CandidateExecutionStates.Processing
                or CandidateExecutionStates.BrokerSubmitting
                ? CandidateExecutionStates.Processing
                : State;""",
              'normalize active claim status',
          )
          path.write_text(text)

          # Executor heartbeat, route-specific stop validation, and final absolute stop.
          path = Path('ctrader-engine/src/AutoTradeEngine.cs')
          text = path.read_text()
          text = replace_once(
              text,
              """        await PublishAsync(
                  \"error\",
                  $\"candidate {Short(candidate.CandidateId)} failed: {exception.Message}\",""",
              """        await PublishAsync(
                  \"retryable_error\",
                  $\"candidate {Short(candidate.CandidateId)} failed: {exception.Message}\",""",
              'retryable candidate event',
          )
          text = replace_once(
              text,
              """      stopPlan = StructureStop(candidate, direction, expectedEntry, symbol);""",
              """      stopPlan = StructureStop(
                candidate,
                direction,
                expectedEntry,
                symbol,
                validateContract: false
              );""",
              'defer route-specific stop validation',
          )
          text = replace_once(
              text,
              """  private StructureStopPlan StructureStop(
                TradeCandidate candidate,
                TradeDirection direction,
                decimal entryPrice,
                SymbolInfo symbol
              )""",
              """  private StructureStopPlan StructureStop(
                TradeCandidate candidate,
                TradeDirection direction,
                decimal entryPrice,
                SymbolInfo symbol,
                bool validateContract = true
              )""",
              'stop validation option',
          )
          text = replace_once(
              text,
              """    ValidateProtectiveStopContract(candidate, plan, entryPrice, symbol);
              return plan;""",
              """    if (validateContract)
              {
                ValidateProtectiveStopContract(candidate, plan, entryPrice, symbol);
              }
              return plan;""",
              'conditional stop validation',
          )
          text = replace_once(
              text,
              """  {
              InitialSizingResult sizing;
              var boxTarget = IsBoxRangeScalp(candidate)""",
              """  {
              ValidateProtectiveStopContract(
                candidate,
                stopPlan,
                expectedEntry,
                RequireSymbol()
              );
              InitialSizingResult sizing;
              var boxTarget = IsBoxRangeScalp(candidate)""",
              'market route stop validation',
          )
          text = replace_once(
              text,
              """    return new OpposingZoneStopContext(
                null,
                zoneLow,""",
              """    return new OpposingZoneStopContext(
                candidate.StopAdjustmentZoneId,
                zoneLow,""",
              'opposing zone id',
          )
          old = """    if (
              candidate.StopAdjustmentZoneLow != plan.AdjustmentZoneLow
              || candidate.StopAdjustmentZoneHigh != plan.AdjustmentZoneHigh
            )
            {
              return false;
            }
            if (
              candidate.StopAdjustmentZoneId is string candidateZoneId
              && plan.AdjustmentZoneId is string planZoneId
            )
            {
              return string.Equals(
                candidateZoneId,
                planZoneId,
                StringComparison.Ordinal
              );
            }
            return true;"""
          new = """    return candidate.StopAdjustmentZoneLow == plan.AdjustmentZoneLow
              && candidate.StopAdjustmentZoneHigh == plan.AdjustmentZoneHigh
              && string.Equals(
                candidate.StopAdjustmentZoneId,
                plan.AdjustmentZoneId,
                StringComparison.Ordinal
              );"""
          text = replace_once(text, old, new, 'exact opposing zone identity')
          text = replace_once(
              text,
              """    var stopLoss = direction == TradeDirection.Buy
                ? fill - stopPlan.Distance
                : fill + stopPlan.Distance;
              stopLoss = decimal.Round(stopLoss, symbol.Digits, MidpointRounding.AwayFromZero);
              await client.AmendPositionStopLossAsync(
                execution.PositionId,
                stopLoss,
                cancellationToken
              );""",
              """    var stopLoss = stopPlan.StopLoss;
              if (
                direction == TradeDirection.Buy
                  ? stopLoss >= fill
                  : stopLoss <= fill
              )
              {
                await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
                throw new VolumePlanningException(
                  \"broker fill invalidated final protective stop\"
                );
              }
              await client.AmendPositionStopLossAsync(
                execution.PositionId,
                stopLoss,
                cancellationToken
              );""",
              'approved absolute market stop',
          )
          text = replace_once(
              text,
              """      await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
              await DeleteGroupPlanAsync(groupId, CancellationToken.None);
              throw;""",
              """      await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
              throw;""",
              'preserve single limit recovery metadata',
          )
          old_zone = """    catch
            {
              await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
              try
              {
                await RollbackZoneFillAsync(
                  candidate.CandidateId,
                  placed,
                  cancellationToken
                );
              }
              finally
              {
                await DeleteGroupPlanAsync(groupId, CancellationToken.None);
              }
              throw;
            }"""
          new_zone = """    catch
            {
              // The last broker request may have been accepted. Keep deterministic
              // client IDs and group metadata for adoption; stale workers must not
              // cancel possibly accepted successor orders.
              await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
              throw;
            }"""
          text = replace_once(text, old_zone, new_zone, 'uncertain zone-fill recovery')
          text = replace_once(
              text,
              """      await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
              await DeleteGroupPlanAsync(groupId, CancellationToken.None);
              throw;""",
              """      await MarkBrokerOutcomeUnknownAsync(CancellationToken.None);
              throw;""",
              'preserve manual limit recovery metadata',
          )

          heartbeat_old = """    _activeLease = lease;
            try
            {
              var advance = await WithGateAsync(
                () => ProcessCandidateAsync(candidate, cancellationToken),
                cancellationToken
              );
              if (advance)
              {
                _reportedErrors.Remove(candidate.CandidateId);
              }
              return advance;
            }
            catch (AutoTradeConfigurationException)
            {
              await ReleaseActiveCandidateAsync(cancellationToken);
              throw;
            }
            catch (Exception exception) when (exception is not OperationCanceledException)
            {
              await ReleaseActiveCandidateAsync(cancellationToken);
              await store.IncrementMetricAsync(
                candidate.Symbol,
                \"lifecycle_error\",
                cancellationToken
              );
              if (_reportedErrors.Add(candidate.CandidateId))
              {
                await PublishAsync(
                  \"retryable_error\",
                  $\"candidate {Short(candidate.CandidateId)} failed: {exception.Message}\",
                  cancellationToken,
                  candidate.CandidateId
                );
                _log(
                  $\"auto-trade candidate {Short(candidate.CandidateId)} failed: \"
                  + $\"{exception.GetType().Name}: {exception.Message}\"
                );
              }
              return false;
            }
            finally
            {
              _activeLease = null;
            }"""
          heartbeat_new = """    _activeLease = lease;
            using var candidateCancellation = CancellationTokenSource.CreateLinkedTokenSource(
              cancellationToken
            );
            Exception? leaseFailure = null;
            var heartbeat = Task.Run(async () =>
            {
              try
              {
                using var timer = new PeriodicTimer(TimeSpan.FromSeconds(30));
                while (await timer.WaitForNextTickAsync(candidateCancellation.Token))
                {
                  if (await RenewActiveLeaseAsync(candidateCancellation.Token))
                  {
                    continue;
                  }
                  var status = await store.GetCandidateStatusAsync(
                    candidate.CandidateId,
                    CancellationToken.None
                  );
                  if (
                    status is not null
                    && (
                      status.StartsWith(\"ordered:\", StringComparison.Ordinal)
                      || status.StartsWith(\"rejected:\", StringComparison.Ordinal)
                      || status == \"dry_run\"
                    )
                  )
                  {
                    return;
                  }
                  leaseFailure = new InvalidOperationException(
                    \"candidate lease lost during execution\"
                  );
                  candidateCancellation.Cancel();
                  return;
                }
              }
              catch (OperationCanceledException) when (candidateCancellation.IsCancellationRequested)
              {
              }
            }, CancellationToken.None);
            try
            {
              try
              {
                var advance = await WithGateAsync(
                  () => ProcessCandidateAsync(candidate, candidateCancellation.Token),
                  candidateCancellation.Token
                );
                if (leaseFailure is not null)
                {
                  throw leaseFailure;
                }
                if (advance)
                {
                  _reportedErrors.Remove(candidate.CandidateId);
                }
                return advance;
              }
              catch (OperationCanceledException) when (leaseFailure is not null)
              {
                throw leaseFailure;
              }
            }
            catch (AutoTradeConfigurationException)
            {
              await ReleaseActiveCandidateAsync(CancellationToken.None);
              throw;
            }
            catch (Exception exception) when (exception is not OperationCanceledException)
            {
              await ReleaseActiveCandidateAsync(CancellationToken.None);
              await store.IncrementMetricAsync(
                candidate.Symbol,
                \"lifecycle_error\",
                CancellationToken.None
              );
              if (_reportedErrors.Add(candidate.CandidateId))
              {
                await PublishAsync(
                  \"retryable_error\",
                  $\"candidate {Short(candidate.CandidateId)} failed: {exception.Message}\",
                  CancellationToken.None,
                  candidate.CandidateId
                );
                _log(
                  $\"auto-trade candidate {Short(candidate.CandidateId)} failed: \"
                  + $\"{exception.GetType().Name}: {exception.Message}\"
                );
              }
              return false;
            }
            finally
            {
              candidateCancellation.Cancel();
              await heartbeat;
              _activeLease = null;
            }"""
          text = replace_once(text, heartbeat_old, heartbeat_new, 'candidate lease heartbeat')
          path.write_text(text)

          # Lifecycle: recoverable failures are explicitly nonterminal.
          path = Path('ctrader-engine/src/AutoTradeLifecycle.cs')
          text = path.read_text()
          text = replace_once(text, '      ["executor_received"] = 10,', '      ["retryable_error"] = 5,\n      ["executor_received"] = 10,', 'retryable state rank')
          text = replace_once(text, '    "executor_received" => new(true, "executor_received", false),', '    "retryable_error" => new(true, "retryable_error", false),\n    "executor_received" => new(true, "executor_received", false),', 'retryable transition')
          text = replace_once(text, '    "error" or "manual_command_error" or "config_fatal" => new(true, "error", true),', '    "manual_command_error" or "config_fatal" => new(true, "error", true),', 'generic errors are telemetry')
          path.write_text(text)

          # Python/C# entry parity: resolve effective distribution first.
          path = Path('telegram-bot/app/autotrade/execution_policy.py')
          text = path.read_text()
          old = """  # Policy is evaluated against the actual planned entry, not the detector
            # tick. A fill-relative ladder is anchored later to the broker fill and
            # therefore must never be converted into a detection-relative price here.
            planned_entry = (
              (
                min(spot_price, high)
                if direction == \"BUY\"
                else max(spot_price, low)
              )
              if policy.order_type_preference == \"limit\"
              else spot_price
            )"""
          new = """  effective_entry_distribution = (
              policy.entry_distribution
              if policy.entry_distribution != \"either\"
              else \"zone_split\"
              if policy.order_type_preference == \"limit\"
              and zone_width_atr >= 0.5
              else \"single\"
            )
            # A zone split is a limit route even when the broad preference is `either`.
            uses_limit_entry = (
              policy.order_type_preference == \"limit\"
              or effective_entry_distribution == \"zone_split\"
            )
            planned_entry = (
              min(spot_price, high)
              if direction == \"BUY\"
              else max(spot_price, low)
            ) if uses_limit_entry else spot_price"""
          text = replace_once(text, old, new, 'effective entry model')
          old = """    \"entry_distribution\": (
              policy.entry_distribution
              if policy.entry_distribution != \"either\"
              else \"zone_split\"
              if policy.order_type_preference == \"limit\"
              and zone_width_atr >= 0.5
              else \"single\"
            ),"""
          text = replace_once(text, old, '    "entry_distribution": effective_entry_distribution,', 'reuse entry distribution')
          path.write_text(text)

          # Real Redis regression file.
          Path('ctrader-engine/tests/ExecutionFencingRegressionTests.cs').write_text(r'''using ApexVoid.CTraderFeed;
          using StackExchange.Redis;

          namespace CTraderFeed.Tests;

          public sealed class ExecutionFencingRegressionTests
          {
            private static string RedisUrl =>
              Environment.GetEnvironmentVariable("REAL_REDIS_URL")
              ?? throw new InvalidOperationException("REAL_REDIS_URL is required");

            private static async Task<IDatabase> DatabaseAsync()
            {
              var uri = new Uri(RedisUrl);
              var options = new ConfigurationOptions { AbortOnConnectFail = false };
              options.EndPoints.Add(uri.Host, uri.Port);
              if (int.TryParse(uri.AbsolutePath.Trim('/'), out var database))
              {
                options.DefaultDatabase = database;
              }
              var mux = await ConnectionMultiplexer.ConnectAsync(options);
              return mux.GetDatabase();
            }

            [Fact]
            public async Task RetryableReleaseCanBeReclaimed()
            {
              await using var store = await StackExchangeRedisSeriesCommands.ConnectAsync(RedisUrl);
              var db = await DatabaseAsync();
              const string candidate = "fence-retry";
              const string eventId = "44-0";
              var key = $"auto_trade:candidate:{candidate}";
              await db.KeyDeleteAsync(key);
              await db.StringSetAsync(key, CandidateExecutionRecord.Published(
                candidate, eventId, DateTimeOffset.UtcNow.ToUnixTimeSeconds()
              ).Serialize());
              var first = Assert.IsType<CandidateExecutionLease>(await store.TryClaimCandidateAsync(
                candidate, eventId, TimeSpan.FromSeconds(2), CancellationToken.None
              ));
              Assert.True(await store.ReleaseCandidateAsync(
                candidate, eventId, first.Token, CancellationToken.None
              ));
              var second = await store.TryClaimCandidateAsync(
                candidate, eventId, TimeSpan.FromMinutes(2), CancellationToken.None
              );
              Assert.NotNull(second);
              Assert.NotEqual(first.Token, second!.Token);
              await db.KeyDeleteAsync(key);
            }

            [Fact]
            public async Task StaleOwnerCannotOverwriteSuccessorCompletion()
            {
              await using var store = await StackExchangeRedisSeriesCommands.ConnectAsync(RedisUrl);
              var db = await DatabaseAsync();
              const string candidate = "fence-stale";
              const string eventId = "45-0";
              var key = $"auto_trade:candidate:{candidate}";
              await db.KeyDeleteAsync(key);
              await db.StringSetAsync(key, CandidateExecutionRecord.Published(
                candidate, eventId, DateTimeOffset.UtcNow.ToUnixTimeSeconds()
              ).Serialize());
              var first = Assert.IsType<CandidateExecutionLease>(await store.TryClaimCandidateAsync(
                candidate, eventId, TimeSpan.FromSeconds(1), CancellationToken.None
              ));
              await Task.Delay(1200);
              var second = Assert.IsType<CandidateExecutionLease>(await store.TryClaimCandidateAsync(
                candidate, eventId, TimeSpan.FromMinutes(2), CancellationToken.None
              ));
              await store.CompleteCandidateAsync(
                candidate, eventId, second.Token, "ordered:second", CancellationToken.None
              );
              await Assert.ThrowsAsync<InvalidOperationException>(() => store.CompleteCandidateAsync(
                candidate, eventId, first.Token, "ordered:first", CancellationToken.None
              ));
              Assert.Equal("ordered:second", await store.GetCandidateStatusAsync(
                candidate, CancellationToken.None
              ));
              await db.KeyDeleteAsync(key);
            }

            [Fact]
            public async Task BrokerSubmittingReleasePreservesDurableUnknown()
            {
              await using var store = await StackExchangeRedisSeriesCommands.ConnectAsync(RedisUrl);
              var db = await DatabaseAsync();
              const string candidate = "fence-unknown";
              const string eventId = "46-0";
              var key = $"auto_trade:candidate:{candidate}";
              await db.KeyDeleteAsync(key);
              await db.StringSetAsync(key, CandidateExecutionRecord.Published(
                candidate, eventId, DateTimeOffset.UtcNow.ToUnixTimeSeconds()
              ).Serialize());
              var lease = Assert.IsType<CandidateExecutionLease>(await store.TryClaimCandidateAsync(
                candidate, eventId, TimeSpan.FromMinutes(2), CancellationToken.None
              ));
              Assert.True(await store.TransitionCandidateStateAsync(
                candidate, eventId, lease.Token,
                CandidateExecutionStates.BrokerSubmitting, CancellationToken.None
              ));
              Assert.True(await store.ReleaseCandidateAsync(
                candidate, eventId, lease.Token, CancellationToken.None
              ));
              var record = CandidateExecutionRecordParser.Parse(
                (await db.StringGetAsync(key)).ToString()
              );
              Assert.Equal(CandidateExecutionStates.BrokerOutcomeUnknown, record.State);
              Assert.Null(record.LeaseToken);
              Assert.True(await db.KeyTimeToLiveAsync(key) > TimeSpan.FromDays(6));
              Assert.NotNull(await store.TryClaimCandidateAsync(
                candidate, eventId, TimeSpan.FromMinutes(2), CancellationToken.None
              ));
              await db.KeyDeleteAsync(key);
            }
          }
          ''')
          PY

