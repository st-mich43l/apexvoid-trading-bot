name: Build & Deploy

# Build the bot image, push to Docker Hub, then deploy on the VPS by pulling the
# new tag (via ansible-library). This repo needs DOCKERHUB_TOKEN + ANSIBLE_VAULT_PASSWORD.

on:
  push:
    branches: [master]
    paths:
      - "algo-bot/**"
      - "ctrader-engine/**"
      - "config/**"
      - "docs/redis-contract.md"
      - "deployment-template/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# A backlog of queued/retried runs (eg. after a GitHub Actions outage) used
# to all unblock at once and run their "deploy" jobs concurrently against the
# same host - confirmed live 2026-08-06: the same commit's ansible-playbook
# deploy ran twice, 20 minutes apart, back-to-back. Serialize instead of
# cancelling: a deploy already applying changes on the host must always run
# to completion, never get cut off mid-restart by a newer run superseding it.
concurrency:
  group: build-deploy-master
  cancel-in-progress: false

jobs:
  release:
    uses: st-mich43l/action-library/.github/workflows/build-push-deploy.yml@master
    with:
      project: apexvoid-trading-bot
      registry-namespace: mich43l
      images: >-
        [
          {"name": "apexvoid-trading-bot", "context": "algo-bot", "dockerfile": "algo-bot/Dockerfile"},
          {"name": "apexvoid-ctrader-engine", "context": "ctrader-engine", "dockerfile": "ctrader-engine/Dockerfile"}
        ]
    secrets:
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
      vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
