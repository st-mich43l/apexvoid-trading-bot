name: Autotrade Integrity

# Short PR validation for live TradePlan V8 publish / execute / manage.
# Path allowlist is algo-bot/tests/ci_autotrade_paths.txt. Catalog,
# scanner-actionability, and retired V6 characterization suites are out.

on:
  pull_request:
    paths:
      - "algo-bot/**"
      - "ctrader-engine/**"
      - "contracts/autotrade/**"
      - "contracts/configuration/**"
      - "docker-compose.yml"
      - ".github/workflows/autotrade-integrity.yml"

jobs:
  python:
    name: Python autotrade suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apexvoid
          POSTGRES_PASSWORD: apexvoid
          POSTGRES_DB: signals
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U apexvoid -d signals"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            algo-bot/requirements.txt
            algo-bot/requirements-dev.txt

      - name: Install dependencies
        working-directory: algo-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run V8 execution pytest
        working-directory: algo-bot
        env:
          REAL_REDIS_URL: redis://127.0.0.1:6379/15
          DATABASE_URL: postgresql://apexvoid:apexvoid@127.0.0.1:55432/signals
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # Allowlist only. Do not "run everything then deselect leftovers".
          pytest -q \
            --junitxml=pytest-results.xml \
            $(grep -E '^tests/' tests/ci_autotrade_paths.txt)
      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-results
          path: algo-bot/pytest-results.xml

      - name: Dead-code report
        continue-on-error: true
        working-directory: algo-bot
        run: python -m vulture app tests/vulture_whitelist.py --min-confidence 90

  csharp:
    name: C# autotrade suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        working-directory: ctrader-engine
        run: dotnet build src/CTraderFeed.csproj --nologo

      - name: Test
        working-directory: ctrader-engine
        env:
          REAL_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          # Exclude leftover scale-in volume fixtures (80/20 lot table), not
          # the live V8 TradePlan runtime.
          dotnet test tests/CTraderFeed.Tests.csproj --nologo \
            --filter "FullyQualifiedName!~ScaleInPlannerTests&FullyQualifiedName!~EquityZoneLadderGroupLifecycleMatchesAcceptance&FullyQualifiedName!~CalculateVolumeSlicesForMarketWithLimitScaleMatchEquity1300&FullyQualifiedName!~CalculateVolumeSlicesForALimitLadderAreProportionalToLegVolumeRatio&FullyQualifiedName!~MarketWithLimitScaleSubmitsL1MarketAndL2LimitOnFirstPoll&FullyQualifiedName!~SmallZoneFillPlanFallsBackToSingleEntryAndRecordsReason" \
            --logger "trx;LogFileName=csharp-results.trx" \
            --results-directory TestResults

      - name: Upload C# test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: ctrader-engine/TestResults

  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          touch .env
          docker compose config -q
