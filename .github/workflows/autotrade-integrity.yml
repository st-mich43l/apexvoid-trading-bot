name: Autotrade Integrity

# PR validation that every service BUILDS and the stack file is valid. There are no tests in
# this repository; this is the only gate.

on:
  pull_request:
    paths:
      - "algo-bot/**"
      - "analysis-engine/**"
      - "contracts/analysis/**"
      - "ctrader-engine/**"
      - "contracts/autotrade/**"
      - "docker-compose.yml"
      - ".github/workflows/autotrade-integrity.yml"

jobs:
  python:
    name: Python bot compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: algo-bot/requirements.txt

      - name: Install dependencies and compile
        working-directory: algo-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q app tools

  go-analysis:
    name: Go analysis engine builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: analysis-engine/go.mod
          cache-dependency-path: analysis-engine/go.sum
      - name: Build and vet
        working-directory: analysis-engine
        run: |
          go build ./...
          go vet ./...

  csharp:
    name: C# ctrader engine builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        working-directory: ctrader-engine
        run: dotnet build src/CTraderFeed.csproj --nologo

  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          touch .env
          docker compose config -q
