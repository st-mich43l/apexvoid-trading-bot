# Development environment overlay.
#
# Values here intentionally differ from production where local execution
# requires broader observation and testing behavior.
runtime:
  environment: demo
  broker:
    require_demo: true

execution:
  mapped_zone:
    hard_entry_drift_pips: 20.0
    max_entry_drift_atr: 1.0
    min_entry_drift_pips: 10.0
  policy:
    structural_reaction_lookback_bars: 3
  range:
    hard_entry_drift_pips: 20.0
    max_entry_drift_atr: 1.0
    min_entry_drift_pips: 10.0
  trend:
    hard_entry_drift_pips: 30.0
    max_entry_drift_atr: 1.5
    min_entry_drift_pips: 15.0
  zone_scaling:
    fill_enabled: true

auto_algo:
  enabled: true
  dry_run: false
  strategy_match_enabled: true

  actionability:
    counter_bias:
      allowed: true
    structural_guard:
      guard_mode: observe
    zone_reconciliation:
      mode: shadow

  lifecycle:
    candidate:
      storage_ttl_seconds: 604800

  strategies:
    mapped_zone:
      enabled: true
    matching:
      multiple_matches_enabled: true
    range_reversion:
      # Keep this explicit so the development behavior is visible here.
      enabled: true
    reaction:
      demand:
        enabled: true
      enabled: true
      key_level:
        enabled: true
      liquidity_reversal:
        enabled: true
      session_level:
        enabled: true
      supply:
        enabled: true
      trendline:
        enabled: true
    trend:
      enabled: true
