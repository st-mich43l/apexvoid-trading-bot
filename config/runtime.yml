# Service identity, runtime mode, and logging — owned exclusively here.
# This file owns service identity, mode, and logging.
runtime:
  # Service environment selected by the root YAML entrypoint.
  environment: production

  # The only real timezone value anywhere in the current system today is
  # telegram.presentation.seq_reset_tz (kept in telegram.yml —
  # it is specifically Telegram sequence-reset scoped). Recorded here too
  # as the service-wide operational timezone since every session/killzone
  # boundary in the system is computed against it in practice.
  timezone: Asia/Ho_Chi_Minh

  # These are application defaults. Deployment-only paths and credentials
  # remain environment-specific infrastructure settings.
  logging:
    directory: /var/log/apexvoid
    retention_days: 14
    file_enabled: true
    level: INFO
    file_name:
      algo-bot: algo-bot.log
      ctrader-engine: ctrader-engine.log
      analysis-engine: analysis-engine.log

  # contract.account.* / contract.mode in the old file — broker/account
  # identity and the execution contract version in force.
  broker:
    expected_broker: fpmarkets
    require_demo: true

  # Shared market-feed process settings. Symbol identity and timeframes are
  # instrument-owned in instruments.yml; these are the connection-wide
  # retention/quality settings used by ctrader-engine.
  feed:
    backfill_bars: 2000
    bars_window_max: 2000
    bar_quality_lookback: 6
    bars_channel: bars:new
  # Shared transport and persistence topology. All service infrastructure
  # settings live below runtime so every reader consumes the same native tree.
  redis:
    url: redis://redis:6379/0
    bars_channel: bars:new
    reconciliation_interval_seconds: 30

  redis_streams:
    events: auto_trade:events
    trade_plans: execution:trade_plans
    stream_maximum_length: 1000

  kafka:
    enabled: true
    brokers:
      - kafka:9092
    client_id:
      analysis_engine: apexvoid-analysis-engine
      algo_bot: apexvoid-algo-bot
    outbox_path: /var/lib/apexvoid-analysis-engine/publication-ledger.json
    topics:
      analysis_opportunity: analysis.opportunity.v1
      analysis_opportunity_invalidated: analysis.opportunity.invalidated.v1
      analysis_opportunity_arbitration: analysis.opportunity.arbitration.v1
    topic_specs:
      analysis.opportunity.v1:
        partitions: 3
        replication_factor: 1
        retention_ms: 604800000
      analysis.opportunity.invalidated.v1:
        partitions: 3
        replication_factor: 1
        retention_ms: 604800000
      analysis.opportunity.arbitration.v1:
        partitions: 3
        replication_factor: 1
        retention_ms: 86400000
      execution.trade-plan.v1:
        partitions: 3
        replication_factor: 1
        retention_ms: 604800000
      execution.trade-event.v1:
        partitions: 3
        replication_factor: 1
        retention_ms: 604800000

  postgres:
    host: postgres
    port: 5432
    database: signals
    username: apexvoid
