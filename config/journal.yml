# Trade journaling/history behavior — owned exclusively here.
# This category records the journal persistence policy. The system
# already always persists trade plans, analysis context, and execution
# events (Postgres `auto_trade_results`/`auto_trade_fills`/`pips_log`
# tables plus the `auto_trade:events` Redis stream) — none of this is
# currently a configurable on/off switch anywhere in the code. This
# records that observed always-on behavior rather than inventing toggles
# that don't exist yet; wiring these as real switches is a later-stage
# decision once a runtime reads this file.
journal:
  enabled: true

  persist:
    trade_plan: true
    analysis_snapshot: true
    execution_events: true
    math_telemetry: true
