# Execution/broker mechanics and risk-execution behavior — owned logically
# by ctrader-engine. Market interpretation never belongs here; the
# executor stays mechanical. Direct copy of the old trading-bot.yml's
# `execution.*` block — see docs/configuration-v3-migration-audit.md §5.
execution:
  technique:
    # Enforce strict PD + hard SL cap; killzone clock and sweep/body off.
    # Prod dig 2026-08-11: require_sweep_body was killing ~22 valid
    # impulse_pullback candidates/hour (both directions,
    # confirmed via scalping.strategies' "sweep gate rejection" diagnostic)
    # with zero fills getting through - archetypes' own pattern match is
    # the confirmation again, same as before the 2026-08-10 technique pack.
    enforce: true
    include_late_ny: true
    london_window_hours: 3
    ny_window_hours: 3
    reaction_require_killzone: false
    # Non-scalp: structure + strategy technique decide; do not sterilize by
    # UTC publish windows. Weak volume/momentum hours are analysis rejects.
    reaction_require_publish_window: false
    # Scalp: structure + technique decide; do not sterilize by UTC killzone.
    # Weak volume/momentum hours are rejected by analysis, not the clock.
    scalp_require_killzone: false
    # Pair focus is quality context, never a clock hard gate. FX overrides set
    # 3 so selective (score 1) hours need a three-confluence strategy.
    selective_session_min_confluence: 0
    require_sweep_body: false
    strict_premium_discount: true
    # Strict PD only for reversal + range_reversion archetypes (not continuation).
    # Measured asymmetry in trends: ~93% BUY allowed in downtrend vs ~4% SELL;
    # applying strict PD to momentum/trend_pullback inverts their intended edge.
    strict_premium_discount_archetypes:
      - reversal
      - range_reversion
    # MAD is entry quality / structure analysis only — never block activation.
    mad_hard_gate_enabled: false

  activation:
    # Enforce entry location while permitting a fresh M5-confirmed Key Level
    # or Reaction setup to execute inside its zone. Non-authoritative setups
    # still require their normal M1 confirmation.
    mode: enforce
    m5_authoritative_fallback: quote_inside_fresh
    m5_confirmation_maximum_age_bars: 6
    reaction_trigger_maximum_age_bars: 2

  broker_recovery:
    absence_confirmations: 2

  entry:
    contract_tolerance_pips: 3.0
    inside_zone_market_entry_enabled: true
    max_spread_pips: 5
    maximum_chase_distance_pips: 40.0
    poll_ms: 250

  mapped_zone:
    execute_tolerance_atr: 0.15
    execute_tolerance_pips: 3.0
    hard_entry_drift_pips: 20.0
    max_entry_drift_atr: 1.0
    min_entry_drift_pips: 10.0
    reaction_lookback_bars: 5
    thesis_lock_enabled: true

  policy:
    displacement_override_lookback_bars: 3
    execution_zone_max_width_atr: 2.0
    execution_zone_max_width_pips: 100.0
    group_close_allocation: pro_rata
    label: apexvoid-auto
    max_tranches: 2
    structural_reaction_lookback_bars: 3

  range:
    box_move_sl_to_be_after_scale_out: false
    box_scale_out_fraction: 0.5
    box_scale_out_threshold_pips: 70
    box_scale_out_trigger_pips: 30
    hard_entry_drift_pips: 20.0
    max_entry_drift_atr: 1.0
    min_entry_drift_pips: 10.0
    min_rr: 1.0
    min_target_pips: 15.0
    room_stop_floor_pips: 15
    tp_buffer_pips: 3.0

  reaction:
    market_fraction: 0.8
    room_stop_min_rr: 1.0
    scale_fraction: 0.2
    scale_invalid_policy: single_market
    # 2026-09-16: keep the file override aligned with the schema default.
    # A 0.5x ATR second leg pushed the furthest stop beyond XAU's 60-pip
    # envelope; 0.1x ATR retains a real scale while leaving stop headroom.
    scale_step_atr: 0.1
    stop_max_pips: 60
    stop_min_pips: 40

  scaling:
    add:
      level_buffer_atr: 1.0
      min_stop_pips: 30
      size_ratio: 0.5
      stop_buffer_atr: 0.3

  stops:
    be_buffer_ticks: 6
    reaction:
      room_floor_pips: 40
    sl_distance: 6.5
    stop_push_beyond_zone: true
    trend:
      minimum_pips: 40
    wick_stop_buffer_atr: 0.15

  targeting:
    default_ladder_pips:
      - 30
      - 60
      - 90
      - 120
      - 200
    post_fill_target_fallback: fill_relative
    range_ladder_pips:
      - 15
      - 20
      - 30
      - 40
      - 50
      - 70
    tp_weights:
      - '20'
      - '20'
      - '20'
      - '20'
      - '20'
    unfilled_leg_after_tp_policy: cancel

  trend:
    hard_entry_drift_pips: 30.0
    max_entry_drift_atr: 1.5
    min_entry_drift_pips: 15.0
    stop_max_pips: 60

  zone_scaling:
    fill_enabled: true
    fill_fallback_enabled: true
    first_leg_fraction: 0.8
    # Same XAU reaction-ladder incident as execution.reaction above.
    scale_step_atr: 0.1
    scale_undersized_policy: single_entry
