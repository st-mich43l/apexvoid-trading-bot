    price_scale:
      # Preserve production gold analysis geometry (schema/global defaults).
      round_step: 5.0
      market_map:
        change_min: 1.0
        fallback_radius_price: 30.0
        scalp_radius_price: 15.0
      zone_merge_gap_price: 1.0
      zone_merge_max_width: 6.0
      opposing_minimum_separation_price: 15.0
      fvg_entry_max_width_price: 5.0
    targeting:
      mode: fixed_rr
      reward_risk: 2.0
      target_r_multiples:
      - 1.0
      - 1.5
      - 2.0
      close_ratios:
      - 0.25
      - 0.25
      - 0.50
      trail_after_r: 1.5
      trail_to_r: 1.0
      entry_clips: 2
    manual:
      enabled: true
      algo_enabled: true
      entry_mode: zone_ladder
      risk_reference: shallow
      risk_multiplier: 1.0
      tp1_close_fraction: 0.40
    market_data:
      lookbacks:
        h1_bars: 400
        m15_bars: 250
        m1_bars: 150
        m5_bars: 150
    timeframes:
    - H1
