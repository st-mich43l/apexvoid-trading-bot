# Infrastructure messaging/cache configuration — owned exclusively here.
# See docs/configuration-v3-migration-audit.md §5/§9: no Kafka topics
# existed anywhere in this codebase before the Kafka transport task. The
# `transport.kafka` block below is now real, implemented, and read by
# analysis-engine's Go transport (internal/transport/kafka/config.go via
# internal/engine/config.go's KafkaConfigFromConfig — the one place
# internal/config.Document is read, same discipline as every other
# Analysis Engine V2 config section) — see docs/transport/kafka.md and
# ADR-008/ADR-009 for the full design.
transport:
  redis:
    # bootstrap.redis.url's real current default (app/configuration/models/
    # bootstrap.py) — REDIS_URL in .env.example carries the same value.
    url: redis://redis:6379/0

  # The Redis stream names / version the system actually uses today
  # (contract.streams.* / contract.versions.* in the old trading-bot.yml)
  # — the direct analogue of the new architecture's Kafka `topics:` block,
  # for the transport actually in use.
  redis_streams:
    candidates: auto_trade:candidates
    events: auto_trade:events
    trade_plans: execution:trade_plans
    candidate_maximum_length: 1000
    candidate_version: 6

  kafka:
    # Was `false` through the Go-transport-only task (no broker existed
    # anywhere in deployment). The cTrader -> Kafka -> Analysis Engine
    # pipeline task is exactly "the tasks that follow" that deferral: a
    # real Kafka broker now exists in both docker-compose.yml (local)
    # and deployment-template/docker-compose.yml.j2 (production), with
    # kafka-init provisioning the required topics before any producer/
    # consumer starts (source task §31/§36). `production.yml`'s own
    # overlay is deliberately empty ("run the base config exactly as
    # declared") — flipping this here, in the base file, not in an
    # environment overlay, is what keeps that invariant true while still
    # making Kafka live for both environments.
    enabled: true

    brokers:
      - kafka:9092

    client_id:
      analysis_engine: apexvoid-analysis-engine
      # cTrader → Kafka → Analysis Engine task: ctrader-engine's own
      # Kafka client_id — read via ConfigurationV3 (never ENV, never
      # added to ResolvedRuntimeManifest — Kafka transport config comes
      # from V3 only, source task §14/§15).
      ctrader_engine: apexvoid-ctrader-engine

    topics:
      market_bar_closed: market.bar.closed.v1
      market_tick: market.tick.v1
      analysis_opportunity: analysis.opportunity.v1
      analysis_opportunity_invalidated: analysis.opportunity.invalidated.v1

    consumer_groups:
      analysis_engine: apexvoid-analysis-engine-v1

    # Tick consumption stays off until a real tick producer exists
    # (source task §3/§28) — the Go decoder/contract is ready regardless
    # (contracts/market/tick-v1.schema.json).
    tick_consumption_enabled: false

    # Physical topic provisioning — consumed ONLY by
    # analysis-engine/cmd/kafka-admin (source task §31), keyed by the
    # real topic name (not the logical alias above), so the admin tool
    # never needs to know the alias mapping. Deliberately a SEPARATE
    # section from `topics` above rather than nesting these fields
    # inside it (source task §32's own "or an equivalent validated
    # structure"): `topics.*` is read by every producer/consumer as a
    # plain string (already shipped, both in Go's
    # engine.KafkaConfigFromConfig and .NET's KafkaOptions.FromConfig)
    # — nesting partition/replication settings inside it would force
    # every existing reader to change shape for a concern only the
    # admin tool actually has.
    topic_specs:
      market.bar.closed.v1:
        # >5 (today's live instrument count: XAU, EURUSD, GBPUSD,
        # GBPJPY, USDJPY — config/instruments.yml) so per-symbol key
        # hashing has room before two symbols collide onto the same
        # partition, without over-provisioning partitions a single-node
        # broker gains nothing from (source task §34/§35).
        partitions: 6
        replication_factor: 1
        retention_ms: 604800000 # 7 days — enough to replay a missed consumer restart/redeploy window, not unbounded
      market.tick.v1:
        partitions: 6
        replication_factor: 1
        retention_ms: 604800000
      analysis.opportunity.v1:
        # Lower-frequency than raw bars; 3 is still enough headroom for
        # the same 5-symbol set without over-provisioning.
        partitions: 3
        replication_factor: 1
        retention_ms: 604800000
      analysis.opportunity.invalidated.v1:
        partitions: 3
        replication_factor: 1
        retention_ms: 604800000
