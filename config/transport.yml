# Infrastructure messaging/cache configuration — owned exclusively here.
# See docs/configuration-v3-migration-audit.md §5/§9: no Kafka topics
# existed anywhere in this codebase before the Kafka transport task. The
# `transport.kafka` block below is now real, implemented, and read by
# analysis-engine's Go transport (internal/transport/kafka/config.go via
# internal/engine/config.go's KafkaConfigFromConfig — the one place
# internal/config.Document is read, same discipline as every other
# Analysis Engine V2 config section) — see docs/transport/kafka.md and
# ADR-008/ADR-009 for the full design.
transport:
  redis:
    # bootstrap.redis.url's real current default (app/configuration/models/
    # bootstrap.py) — REDIS_URL in .env.example carries the same value.
    url: redis://redis:6379/0

  # The Redis stream names / version the system actually uses today
  # (contract.streams.* / contract.versions.* in the old trading-bot.yml)
  # — the direct analogue of the new architecture's Kafka `topics:` block,
  # for the transport actually in use.
  redis_streams:
    candidates: auto_trade:candidates
    events: auto_trade:events
    trade_plans: execution:trade_plans
    candidate_maximum_length: 1000
    candidate_version: 6

  kafka:
    # Deliberately false in this checked-in config, unlike the source
    # task's own illustrative `enabled: true` example shape — no Kafka
    # broker exists in deployment-template/docker-compose.yml.j2 yet
    # (that cutover is explicitly out of this task's scope, §63), and
    # analysis-engine's composition root fails closed at startup when
    # enabled=true but no broker is reachable (§43) — flipping this to
    # true is real deployment work for the tasks that follow this one
    # (cTrader -> Kafka, algo-bot -> Kafka, deployment topology), not a
    # config-only flag flip.
    enabled: false

    brokers:
      - kafka:9092

    client_id:
      analysis_engine: apexvoid-analysis-engine

    topics:
      market_bar_closed: market.bar.closed.v1
      market_tick: market.tick.v1
      analysis_opportunity: analysis.opportunity.v1
      analysis_opportunity_invalidated: analysis.opportunity.invalidated.v1

    consumer_groups:
      analysis_engine: apexvoid-analysis-engine-v1

    # Tick consumption stays off until a real tick producer exists
    # (source task §3/§28) — the Go decoder/contract is ready regardless
    # (contracts/market/tick-v1.schema.json).
    tick_consumption_enabled: false
