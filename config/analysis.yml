# Market-analysis behavior — owned logically by analysis-engine (Go), still
# readable by every service. Answers "what opportunity exists?", never
# "should ApexVoid act on it?" (that's auto-algo.yml — see its own header).
#
# market_data.* (calendar/session/feed/scanner/spot inputs) is folded in here
# because these are analysis inputs, not execution or delivery concerns.
analysis:
  # Go is live. The Kafka opportunity lifecycle is the sole automatic
  # technical-analysis path; Python only applies execution-time policy.
  technical_authority:
    consumer_enabled: true
    consumer_group: apexvoid-algo-bot-analysis-opportunity-v1
    # Live-freshness limits. A new live plan needs a confirmed observation
    # no older than max_event_age_seconds and a Kafka publish->consume gap no
    # larger than max_delivery_lag_seconds; older events only rebuild the ledger.
    max_event_age_seconds: 900
    max_delivery_lag_seconds: 300
  # The Go engine uses the canonical simple ATR series for this analysis
  # context. Keep the algorithm explicit so all consumers share the same
  # contract.
  indicators:
    atr:
      algorithm: simple
      length: 14

  # Canonical regime/breakout inputs ported from app/analysis/engine.py and
  # app/analysis/regime.py. These are analysis facts, not execution policy.
  coil_contract: 0.8
  regime:
    chop:
      filter_enabled: true
      lookback: 24
      range_atr: 4.0
    direction_enabled: false
    direction_lookback: 120
    min_directional_swings: 3
    min_displacement_atr: 4.0
  breakout:
    buffer_atr: 0.10
    accept_bars: 2

  # Detector-contract read: the bounded closed-bar windows and swing parameters
  # the frozen detectors evaluated direction, premium/discount and chop on.
  # Strategies that reproduce a frozen detector decision gate on this read; the
  # hierarchical structure above keeps owning every other consumer. The values
  # are the frozen production values (market_data.lookbacks, swing_fractal_n,
  # zigzag_*, scanner.htf, counter-trend policy and the H1 warm-up floor).
  legacy_read:
    window_bars:
      M5: 150
      M15: 250
      H1: 400
    swing:
      fractal_n: 2
      zigzag_pct: 0.0
      zigzag_atr_mult: 1.0
    level:
      cluster_atr: 0.5
      min_touches: 2
      max_cluster_span_multiple: 2.0
    displacement:
      atr_mult: 1.5
      body_fraction: 0.6
    zone:
      width: body
      merge_overlap: 0.5
      max_merged_zone_atr: 3.0
      flip_accept_bars: 2
      flip_max_break_age_bars: 48
      flip_band_body_fraction: 0.5
    liquidity:
      equal_tol_atr: 0.15
      inducement_band_atr: 0.3
      sweep_body_fraction: 0.5
      sweep_react_bars: 3
    # Default arguments of the frozen compat helpers (structure.entry_zone and
    # its compat order-block/flip zones). The oracle ran them with these
    # defaults on every instrument (pip 0.1 and round step 5.0 included), so
    # they are not the instrument's own scale.
    compat:
      pip_size: 0.1
      displacement_body_fraction: 0.55
      displacement_atr_mult: 1.5
      fractal_n: 2
      atr_length: 14
      level_cluster_atr: 0.5
      round_step: 5.0
      max_cluster_span_multiple: 2.0
    # Shared decision thresholds of the frozen detectors (DetectorSettings).
    detector:
      maximum_entry_atr: 2.0
      maximum_zone_width_atr: 1.5
      proximal_band_atr: 0.5
      confluence_floor: 2
      fibonacci_enabled: true
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
    htf_order: "H1,M15"
    min_primary_htf_warmup_bars: 50
    allow_counter_trend: true

  # MAD-0 Asia phase classifier. These are descriptive technical inputs and
  # never execution gates; the Go engine owns the resulting phase context.
  mad:
    pip_size: 0.0001
    accum:
      minimum_rq: 0.8
      maximum_rq: 6.0
    expand:
      break_atr: 0.35
      displacement_atr: 1.25
      accept_closes: 2
    manip:
      min_penetration_atr: 0.05
      min_reclaim_atr: 0.05

  # Versioned confluence scoring. The Go Analysis Engine owns the live
  # calculation; these same paths remain in the generated Python projection
  # for decoding and historical compatibility only.
  confluence:
    scoring_version: v1
    v2_star_three_ratio: 0.585
    v2_star_two_ratio: 0.390
    v2_zone_quality_weight: 4.0
    v2_mad_score_weight: 2.0

  # Registry contract for every strategy approved by the semantic catalog.
  # An enabled entry without a compiled factory
  # fails analysis-engine startup; it cannot silently become a no-op.
  #
  # `confluence_zone` is the one compositional exception, so this has 20
  # entries: 19 independent strategies plus Confluence Zone.
  #
  # Enabled strategies include key_level, session_level,
  # supply, demand, order_block, fvg, flip_zone. Each strategy owns its own
  # threshold parsing (internal/strategy/<name>'s own parseConfig) — the
  # registry itself treats these as opaque raw parameters.
  # None
  # These parameter names have no old-Python-detector precedent — the
  # Earlier detector implementations did not parametrize per-setup invalidation/
  # target/expiry this way — so every value below is a genuine initial
  # calibration, not an empirically-tuned or ported constant. They are
  # Treat these values as explicit strategy configuration:
  #   minimum_strength/minimum_touches — floors zone.Zone.Strength (or, for
  #     session_level, the level's touches/strength) below which a setup is
  #     not tradeable at all. (key_level carries only minimum_touches: the
  #     profitable Python detector had no strength or proximity gate.)
  #   invalidation_buffer_atr — matches this file's own existing
  #     invalidation_tolerance_atr/invalidation_penetration_atr convention
  #     (0.5) for "how far beyond the setup's edge before a confirmed close
  #     invalidates it."
  #   minimum_target_distance_atr — the floor below which a candidate
  #     liquidity pool is too close to entry to be a meaningful technical
  #     objective.
  #   expiry_hours — this strategy's own technical SETUP_EXPIRED window,
  #     distinct from Algo Bot's own execution-age policy; 24h is one
  #     trading day.
  # All 21 registry entries have concrete Go factories. Every
  # strategy is enabled for the live Kafka opportunity stream; Algo Bot
  # consumes those events and applies execution policy before publishing V8.
  strategies:
    key_level:
      version: v3
      enabled: true
      minimum_touches: 2
      # The structure Key Level reads: profit_week is the detector contract of
      # 14–18 Sep 2026 (levels counted from fractal swings; order blocks caused
      # by a BOS), the contract of the profitable XAU week. current is the one
      # the other detectors read (wick touches counted, CHoCH order blocks).
      detector_contract: profit_week
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      # Reported target when no opposing liquidity pool exists: a fixed reward:risk
      # beyond the entry. Whether the room is enough is the execution policy's call.
      fallback_target_r: 2.0
      expiry_hours: 24.0
      # Ported from the legacy Python detector's key_level_role.py::
      # classify_key_level_role (breakout_accept_bars) — consecutive
      # closed bars that must accept beyond a level's band before its
      # role is reported BROKEN rather than plain support/resistance.
      # Legacy default (TREND_BREAKOUT_ACCEPT_BARS): 2.
      breakout_accept_bars: 2
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
    confluence_zone:
      version: v2
      enabled: true
      minimum_facts: 2
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 12.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
    supply:
      version: v2
      enabled: true
      minimum_strength: 0.4
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
      # Also evaluate this timeframe's own supply/demand zones against the M5 bars
      # (the frozen Python publishers read the M5 zone population only). The M5
      # reaction confirmation, entry validity and stop rules are unchanged.
      higher_timeframes: [M15]
    demand:
      version: v2
      enabled: true
      minimum_strength: 0.4
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
      # Also evaluate this timeframe's own supply/demand zones against the M5 bars
      # (the frozen Python publishers read the M5 zone population only). The M5
      # reaction confirmation, entry validity and stop rules are unchanged.
      higher_timeframes: [M15]
    order_block:
      version: v2
      enabled: true
      minimum_strength: 0.4
      # 2026-09-30: production saw order blocks as small as 0.03 ATR (half
      # of them under 0.5 ATR); same threshold as fvg/ifvg.
      minimum_zone_atr: 0.5
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
      momentum_body_fraction: 0.6
    fvg:
      version: v2
      enabled: true
      minimum_strength: 0.4
      # 2026-09-30: XAU traded 13-pip gaps (0.36 ATR) because a big middle
      # candle lifted their strength past minimum_strength.
      minimum_gap_atr: 0.5
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 2.0
      entry_max_width_price: 5.0
    ifvg:
      version: v2
      enabled: true
      minimum_strength: 0.4
      # 2026-09-30: XAU traded a 0.10 ATR inverted gap that stopped out for
      # -13 pips inside a minute; same threshold as fvg.
      minimum_gap_atr: 0.5
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
    crt:
      version: v2
      enabled: true
      minimum_h1_range_atr: 1.5
      invalidation_buffer_atr: 0.25
      expiry_hours: 8.0
    flip_zone:
      version: v3
      enabled: true
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # key_level_role.classify_key_level_role: consecutive closes beyond the
      # level's band that make a break accepted (the flip's required role).
      breakout_accept_bars: 2
    session_level:
      version: v3
      enabled: true
      # The frozen session_level_reaction: a reaction off a session / previous-day /
      # previous-week high or low, within the shared reaction band, reaction
      # confirmation and confluence floor (the legacy detector leaves are injected).
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
    trendline:
      version: v3
      enabled: true
      # The frozen trendline_reaction (V2) gates (analysis.trendlines.*,
      # execution.technique.trendline_*): forward validation, health, staleness,
      # chop-regime quality, the live-interaction bands.
      minimum_validation_touches: 1
      chop_minimum_validation_touches: 2
      chop_require_htf_aligned: true
      require_htf_aligned: false
      reject_exhausted: true
      invalidation_buffer_atr: 0.25
      expiry_hours: 12.0
      interaction_band_atr: 0.20
      close_violation_atr: 0.15
      approach_min_distance_atr: 0.10
      maximum_bars_since_last_touch: 30
    range_edge:
      version: v2
      enabled: true
      lookback_bars: 48
      minimum_touches: 2
      minimum_wick_rejections: 1
      minimum_inside_closes: 3
      inside_lookback_bars: 24
      recent_breakout_lookback_bars: 12
      fallback_enabled: true
      fallback_minimum_confirmations: 1
      provisional_enabled: true
      post_impulse_enabled: true
      fallback_min_width_atr: 0.8
      fallback_max_width_atr: 8.0
      fallback_wick_fraction: 0.25
      post_impulse_min_displacement_atr: 3.0
      post_impulse_max_contraction_atr: 2.2
      post_impulse_min_inside_closes: 4
      post_impulse_lookback_bars: 36
      post_impulse_recent_bars: 6
      break_closes: 2
      cluster_atr: 0.25
      cluster_min_abs: 0.0
      cluster_pip_mult: 2.0
      entry_tolerance_atr: 0.25
      maximum_edge_width_atr: 0.75
      minimum_wick_fraction: 0.25
      minimum_width_atr: 1.0
      maximum_width_atr: 6.0
      minimum_room_atr: 0.75
      invalidation_buffer_atr: 0.25
      recent_breakout_buffer_atr: 0.15
      recent_breakout_min_span_atr: 0.8
      expiry_hours: 4.0
    box_breakout:
      version: v3
      enabled: true
      # The frozen box_breakout: an accepted break of the regime box, entered on the
      # accepting displacement bar or on a rejecting retest of the broken edge,
      # within this many bars of the acceptance (analysis.breakout.max_age_bars).
      breakout_max_age_bars: 6
      invalidation_buffer_atr: 0.25
      expiry_hours: 8.0
    break_retest:
      version: v2
      enabled: true
      breakout_accept_bars: 2
      trendline_tolerance_atr: 0.30
      momentum_body_fraction: 0.60
      strict_premium_discount: false
      invalidation_buffer_atr: 0.25
      target_r: 2.0
      expiry_hours: 8.0
    momentum_ride:
      version: v2
      enabled: true
      minimum_body_fraction: 0.6
      maximum_overlap_fraction: 0.35
      invalidation_buffer_atr: 0.25
      minimum_target_distance_atr: 1.0
      expiry_hours: 4.0
      require_momentum_va: false
      momentum_opposition_tolerance: 0.15
    snap_back:
      version: v2
      enabled: true
      # Frozen production snap_atr_mult.
      extension_atr: 1.5
      invalidation_buffer_atr: 0.25
      target_r: 2.0
      expiry_hours: 4.0
      extension_source: impulse
      strict_premium_discount: true
    fade_scalp:
      version: v2
      enabled: true
      invalidation_buffer_atr: 0.25
      target_r: 2.0
      expiry_hours: 4.0
      chop_edge_fraction: 0.25
      strict_premium_discount: true
    liquidity_sweep:
      version: v3
      enabled: true
      # A sweep counts only as the frozen detector contract defined a liquidity
      # event: a lone-extreme pool of the frozen window (equal levels are Fade
      # Scalp's) cleared by the frozen equal-level band, closed back through with
      # frozen grab grade A or B, the reversal's premium/discount location and the
      # shared confluence floor.
      strict_premium_discount: true
      minimum_rejection_body_atr: 0.3
      invalidation_buffer_atr: 0.25
      target_r: 2.0
      expiry_hours: 8.0
    # Range Sweep Scalp — the Python discover_range_sweep of the profitable XAU
    # week: the last 24 closed M5 bars form the range (at least 25 pips wide), a
    # closed M1 bar touches or pierces an edge within the scalp buffer and closes
    # back inside in the trade direction, and the dealing-range position agrees
    # with the edge. Stop/target/spread and the location and trigger-age leaves
    # are the shared auto_algo.strategies.scalping.* book, injected per
    # instrument. XAU only: the frozen scalp lane hosted gold only.
    range_sweep:
      version: v3
      enabled: true
      symbols: [XAU]
      setup_window_bars: 120
      dealing_window_bars: 120
      confirmation_window_bars: 60
      context_max_age_seconds: 420
      context_atr_bars: 14
      active_range_bars: 24
      expiry_minutes: 15
      minimum_range_width_pips: 25
      reward_risk_ladder: [2.0, 1.0]
    # Impulse Pullback Scalp — the Python scalp lane's discover_impulse_pullback of the
    # profitable XAU week: an M5 impulse (displacement of at least 4 ATR, body
    # dominance 0.5) with a corrective pullback (< 0.7 of the impulse body), anchored
    # to an unmitigated M5 zone or a nearby key level whose role agrees, confirmed by
    # a closed M1 bar, with the shared stop/target book. XAU only.
    impulse_pullback:
      version: v3
      enabled: true
      symbols: [XAU]
      setup_window_bars: 120
      dealing_window_bars: 120
      confirmation_window_bars: 60
      confirmation_lookback_bars: 2
      context_max_age_seconds: 420
      context_atr_bars: 14
      active_range_bars: 24
      expiry_minutes: 15
      pullback_extreme_confirm_bars: 2
      impulse_displacement_atr_multiple: 4.0
      impulse_body_dominance: 0.5
      pullback_corrective_ratio: 0.7
      level_proximity_atr_multiple: 1.0
      zone_maximum_atr_multiple: 1.5
      breakout_accept_bars: 2
      swing_fractal_n: 2
      level_cluster_atr: 0.5
      level_round_step: 5.0
      level_minimum_touches: 2
      level_max_cluster_span: 2.0
      displacement_atr_multiple: 1.5
      displacement_body_fraction: 0.6
      reward_risk_ladder: [2.0, 1.0]
    # Breakout Retest Scalp — the profitable-week (14–18 Sep 2026) Python
    # "Breakout Retest V2" engine (app/scalping): M5 setup, M1 execution
    # confirmation. Level sources are the setup window's swings, its M5 key
    # levels, equal highs/lows and a compression box; every source runs through
    # break → acceptance → retest → role flip, and the best-quality armed
    # episode per direction wins. Values are the production values of that
    # period (strategies.scalping.*), not retuned. XAU only: the frozen scalp
    # lane hosted gold only.
    scalp_breakout_retest:
      version: v3
      enabled: true
      symbols: [XAU]
      setup_window_bars: 120
      confirmation_window_bars: 60
      confirmation_lookback_bars: 2
      context_max_age_seconds: 420
      context_atr_bars: 14
      active_range_bars: 24
      expiry_minutes: 15
      # Compression-box path (strategies.scalping.breakout.*).
      box_max_atr: 1.5
      min_break_atr: 0.25
      touch_tol_atr: 0.20
      min_box_bars: 8
      max_box_bars: 20
      min_touches_per_side: 2
      retest_lookback_bars: 5
      require_retest_rejection: true
      # Breakout Retest V2 state machine.
      v2_enabled: true
      breakout_cross_tolerance_atr: 0.0
      breakout_margin_atr: 0.0
      acceptance_bars: 1
      acceptance_required_closes: 1
      min_retest_delay_bars: 0
      max_retest_delay_bars: 20
      retest_front_run_atr: 0.0
      max_retest_penetration_atr: 0.30
      confirmation_mode: reclaim_close
      min_quality_score: 0.0
      enable_structure_flip: true
      enable_m5_key_levels: true
      enable_liquidity_level: true
      swing_min_age_bars: 3
      swing_max_age_bars: 240
      swing_min_spacing_atr: 0.3
      m5_structure_min_touches: 2
      # Setup-window structure (AnalysisSettings defaults of the scalp lane).
      micro_swing_lookback: 3
      equal_tolerance_pip_fraction: 0.5
      swing_fractal_n: 2
      level_cluster_atr: 0.5
      level_round_step: 5.0
      level_minimum_touches: 2
      level_max_cluster_span_multiple: 2.0
      # The stop and target book (buffer multiples, stop min/max pips, minimum net
      # target, maximum spread for the buffer floor) is the shared
      # auto_algo.strategies.scalping.* book and is injected from there, so it has
      # one source. Instrument pip size and price digits are injected per symbol.
      reward_risk_ladder: [2.0, 1.0]

  # Analysis Engine owns these market-state inputs. Depth and thresholds are
  # shared technical configuration, not execution policy.
  # Promotion thresholds describe the structure hierarchy used by Go.
  history:
    # Stored history depth per timeframe — NOT the
    # calculation lookback any one algorithm uses (§6); MarketHistory keeps
    # this much, structure/liquidity request a narrower window at read time.
    depth:
      M1: 2000
      M5: 1000
      M15: 1000
      H1: 500
      H4: 250
      D1: 150

  structure:
    version: v2
    pivot:
      # Matches Python's common swing_fractal_n=2 default (swings.py /
      # structure.py's own find_swings(df, 2, ...) call) — a pivot needs
      # this many strictly-lesser/greater bars on each side to be a raw
      # candidate. Causal: a pivot at bar i is only CONFIRMED once
      # right_bars additional bars have closed.
      left_bars: 2
      right_bars: 2
    swing:
      # A confirmed pivot whose excursion (in ATR) is below this floor is
      # not promoted to a Swing at all — not every fractal is meaningful
      # not every fractal is meaningful.
      minimum_excursion_atr: 0.5
      promotion:
        internal_atr: 1.0
        intermediate_atr: 2.0
        major_atr: 3.5
    equal_level:
      # Matches technique_geometry.py's epsilon() — 0.05 ATR — already the
      # live, tested "same price level" tolerance for zone/level identity.
      tolerance_atr: 0.05
    break:
      # Minimum close penetration beyond a level before invalidation.
      minimum_penetration_atr: 0.5
      # Matches zones.py::displacement()'s k=1.5 / body_frac=0.55 exactly.
      displacement_range_atr: 1.5
      displacement_body_dominance: 0.55
      # Number of bars in which a sweep may be reclaimed.
      sweep_reclaim_bars: 6
      failed_break_reclaim_bars: 3

  liquidity:
    version: v1
    # Same epsilon as structure.equal_level.tolerance_atr — one canonical
    # "same price level" tolerance across structure and liquidity, not two
    # independently-drifting ones.
    equal_level_tolerance_atr: 0.05
    pool_minimum_touches: 2
    sweep_reclaim_bars: 6

  trendlines:
    # V2 keeps A/B anchors immutable, requires a later causal validation, and
    # turns this band into an interaction watch rather than an automatic fill.
    version: v2
    validation_touch_tolerance_atr: 0.30
    interaction_band_atr: 0.20
    invalidation_penetration_atr: 0.50
    close_violation_atr: 0.15
    approach_min_distance_atr: 0.10
    minimum_validation_touches: 1
    minimum_validation_touch_spacing_bars: 5
    validation_reaction_bars: 2
    minimum_validation_favorable_excursion_atr: 0.10
    maximum_wick_violations: 2
    exhaustion_validation_touches: 4
    # Trendline geometry defaults used by the structural analysis pipeline.
    minimum_slope_atr: 0.02
    maximum_slope_atr: 0.15
    minimum_touch_spacing_bars: 3
    minimum_span_bars: 20
    dedup_value_atr: 0.5
    dedup_slope_percent: 0.2

  techniques:
    # Canonical zone lifecycle inputs shared by the Go zone domain and the
    # structural validator and opportunity lifecycle.
    retest_max_touches: 30
    invalidation_tolerance_atr: 0.5
    sweep_reclaim_bars: 6
    max_break_episodes: 2

  zone_relevance:
    immediate_atr: 0.25
    nearby_atr: 1.25
    remote_atr: 3.0

  flip_zone:
    accept_bars: 2
    band_body_fraction: 0.5

  # Go's arbitration groups same-structure opportunities into one thesis
  # (the go_thesis_id Algo Bot consumes) and publishes winner/suppressed/
  # conflict_held decisions as provenance telemetry. It never decides what
  # trades: Algo Bot's execution cycle does, after quote, freshness and risk
  # admission. A same-tier opposite-direction candidate must trail the top one
  # by conflict_margin_quality of Quality.Overall ([0,1]) to count as decisively
  # weaker in this telemetry.
  #
  # in_play_atr bounds the candidates watched around the current price. When
  # any candidate is inside its entry zone, only those executable-now
  # candidates are arbitrated; nearby resting zones are suppressed and cannot
  # create a false BUY-vs-SELL conflict.
  arbitration:
    conflict_margin_quality: 0.15
    in_play_atr: 1.0

  zones:
    version: v1

  # Key-level clustering defaults used by the structural analysis pipeline.
  key_levels:
    # key_levels()'s level_cluster_atr.
    cluster_atr: 0.5
    # key_levels()'s round_step.
    round_step: 5.0
    # key_levels()'s min_touches.
    minimum_touches: 2
    # key_levels()'s max_cluster_span_multiple.
    maximum_cluster_span_multiple: 2.0
  # ATR-normalized velocity thresholds for the price-only momentum read
  # (internal/momentum, a port of app/analysis/momentum.py::momentum_state):
  # v = (close[t] - close[t-n]) / (n * ATR14), bull at v >= velocity_bull_threshold,
  # bear at v <= velocity_bear_threshold. Values equal the Python schema
  # defaults (analysis.momentum.*) so both sides classify identically.
  momentum:
    velocity_lookback: 8
    velocity_bull_threshold: 0.15
    velocity_bear_threshold: -0.15

  # Fibonacci and dealing-range geometry defaults.
  fibonacci:
    # nearest_fib()'s epsilon_atr.
    epsilon_atr: 0.15
    # Technical confluence weight for a confirmed fib touch.
    confluence_weight: 2.5
    # fib_zone_label()'s deep_discount/deep_premium position thresholds —
    # not a coincidence that these equal the 38.2%/61.8% retracement
    # ratios themselves.
    deep_discount: 0.382
    deep_premium: 0.618
    # dealing_range()'s own eq_band=0.10 default, already halved — see
    # internal/fib.Config.EqHalfBand's own comment on why it's stored
    # pre-halved.
    eq_half_band: 0.05

  # §7: zones.merge_max_width / zones.confluence.merge_gap_price (price-
  # absolute, not ATR-relative — see zones.merge_overlap/max_merged_zone_atr
  # above for those) are REMOVED from here, not just left unused. Investigated
  # live: app/core/instrument_geometry.py::merge_max_width(symbol)/
  # merge_gap_price(symbol) already resolve through instrument_runtime_view
  # (analysis_runtime(symbol)), and every live instrument (instruments.yml,
  # each pack or instrument override) already declares its own
  # price_scale.zone_merge_gap_price/zone_merge_max_width — so this was not
  # live-wrong today, but the old global value here (1.0 / 6.0) was byte-
  # identical to XAU's own pack number, meaning a new instrument that forgot
  # to declare these two leaves would have silently inherited XAU's
  # dollar-scale geometry, exactly the failure mode §7 forbids by
  # construction. instruments.yml is the one owner now; each pack/instrument
  # must declare both explicitly (schema should make them required, not
  # defaulted, once a real loader exists).

  # --- market-data inputs retained in the analysis category ---
  calendar:
    currencies:
      - USD
      - EUR
      - GBP
      - JPY
    enabled: true
    event_guard_hours: 4.0
    feed_nextweek: https://nfs.faireconomy.media/ff_calendar_nextweek.json
    feed_thisweek: https://nfs.faireconomy.media/ff_calendar_thisweek.json
    news_brief_hour: 7
    news_guard_block: false
    oil_keywords:
      - crude oil inventories
      - opec
      - cushing
      - api weekly crude
    user_agent: apexvoid-trading-bot/1.0 (+contact)

  # §4/§5: ctrader_feed.symbol/timeframes REMOVED. Feed subscription derives
  # from instruments.yml: subscribe every instrument with rollout == live,
  # using its own broker_symbol and timeframes list — never a second,
  # independent symbol/timeframe list. The single XAUUSD/[M1,M5,M15,H1]
  # this held is exactly instruments.yml's XAU entry (broker_symbol XAUUSD
  # via the aliases list, timeframes from its pack) — a real duplicate, not
  # a distinct concept.

  scanner:
    # Symbols derive from instruments.yml (rollout == live); there is no second list.
    window: 500

  sessions:
    asia_start: 22
    london_start: 7
    ny_start: 13
    # Trading-day boundary for PDH/PDL.
    daily_rollover_utc_hour: 21

  spot:
    maximum_age_seconds: 5

  watcher:
    interval_seconds: 120
    ctrader_stale_seconds: 180
