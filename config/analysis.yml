# Market-analysis behavior — owned logically by analysis-engine (Go), still
# readable by every service. Answers "what opportunity exists?", never
# "should ApexVoid act on it?" (that's auto-algo.yml — see its own header).
#
# market_data.* (calendar/session/feed/scanner/spot inputs) is folded in here
# because these are analysis inputs, not execution or delivery concerns.
analysis:
  # Go is live. The Kafka opportunity lifecycle is the sole automatic
  # technical-analysis path; Python only applies execution-time policy.
  technical_authority:
    consumer_enabled: true
    consumer_group: apexvoid-algo-bot-analysis-opportunity-v1
    # Live-freshness limits. A new live plan needs a confirmed observation
    # no older than max_event_age_seconds and a Kafka publish->consume gap no
    # larger than max_delivery_lag_seconds; older events only rebuild the ledger.
    max_event_age_seconds: 900
    max_delivery_lag_seconds: 300
  # The Go engine uses the canonical simple ATR series for this analysis
  # context. Keep the algorithm explicit so all consumers share the same
  # contract.
  indicators:
    atr:
      algorithm: simple
      length: 14

  # Canonical regime/breakout inputs ported from app/analysis/engine.py and
  # app/analysis/regime.py. These are analysis facts, not execution policy.
  coil_contract: 0.8
  regime:
    chop:
      filter_enabled: true
      lookback: 24
      range_atr: 4.0
    direction_enabled: false
    direction_lookback: 120
    min_directional_swings: 3
    min_displacement_atr: 4.0
  breakout:
    buffer_atr: 0.10
    accept_bars: 2

  # Detector-contract read: the bounded closed-bar windows and swing parameters
  # the frozen detectors evaluated direction, premium/discount and chop on.
  # Strategies that reproduce a frozen detector decision gate on this read; the
  # hierarchical structure above keeps owning every other consumer. The values
  # are the frozen production values (market_data.lookbacks, swing_fractal_n,
  # zigzag_*, scanner.htf, counter-trend policy and the H1 warm-up floor).
  legacy_read:
    window_bars:
      M5: 150
      M15: 250
      H1: 400
    swing:
      fractal_n: 2
      zigzag_pct: 0.0
      zigzag_atr_mult: 1.0
    level:
      cluster_atr: 0.5
      min_touches: 2
      max_cluster_span_multiple: 2.0
    displacement:
      atr_mult: 1.5
      body_fraction: 0.6
    zone:
      width: body
      merge_overlap: 0.5
      max_merged_zone_atr: 3.0
      flip_accept_bars: 2
      flip_max_break_age_bars: 48
      flip_band_body_fraction: 0.5
    liquidity:
      equal_tol_atr: 0.15
      inducement_band_atr: 0.3
      sweep_body_fraction: 0.5
      sweep_react_bars: 3
    # Default arguments of the frozen compat helpers (structure.entry_zone and
    # its compat order-block/flip zones). The oracle ran them with these
    # defaults on every instrument (round step 5.0 included), so they are not the
    # instrument's own scale. pip_size is the exception: the frozen flip-zone
    # retest took a default pip size of 0.1 (gold's), which made its band
    # level +- 0.1 on every other instrument (2,000 pips on EURUSD and GBPUSD, 20 on
    # the JPY pairs). 0 = use the instrument's own pip size; the frozen 0.1 is
    # only ever set by test/detectorparity, to keep proving the oracle golden.
    compat:
      pip_size: 0
      displacement_body_fraction: 0.55
      displacement_atr_mult: 1.5
      fractal_n: 2
      atr_length: 14
      level_cluster_atr: 0.5
      round_step: 5.0
      max_cluster_span_multiple: 2.0
    # Range geometry: the established-range structure builder (techniquezone.BuildScalpStructure)
    # that Fade Scalp reads for its mean-reversion reference and that the opposing-barrier
    # book reads for native room. It is shared market structure, not a strategy: no
    # opportunity is generated from it. Distances are ATR multiples; the clusters scale
    # with the instrument.
    range_structure:
      cluster_atr: 0.25
      cluster_min_abs: 0.0
      cluster_pip_mult: 2.0
      minimum_wick_fraction: 0.25
      entry_tolerance_atr: 0.25
      maximum_edge_width_atr: 0.75
      minimum_width_atr: 1.0
      maximum_width_atr: 6.0
      minimum_room_atr: 0.75
      recent_breakout_buffer_atr: 0.15
      recent_breakout_min_span_atr: 0.8
      fallback_min_width_atr: 0.8
      fallback_max_width_atr: 8.0
      fallback_wick_fraction: 0.25
      post_impulse_min_displacement_atr: 3.0
      post_impulse_max_contraction_atr: 2.2
      lookback_bars: 48
      minimum_touches: 2
      break_closes: 2
      minimum_inside_closes: 3
      inside_lookback_bars: 24
      recent_breakout_lookback_bars: 12
      fallback_minimum_confirmations: 1
      post_impulse_min_inside_closes: 4
      post_impulse_lookback_bars: 36
      post_impulse_recent_bars: 6
      fallback_enabled: true
      provisional_enabled: true
      post_impulse_enabled: true
    # Shared decision thresholds of the frozen detectors (DetectorSettings).
    detector:
      maximum_entry_atr: 2.0
      maximum_zone_width_atr: 1.5
      proximal_band_atr: 0.5
      confluence_floor: 2
      fibonacci_enabled: true
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
    htf_order: "H1,M15"
    min_primary_htf_warmup_bars: 50
    allow_counter_trend: true

  # MAD-0 Asia phase classifier. These are descriptive technical inputs and
  # never execution gates; the Go engine owns the resulting phase context.
  mad:
    pip_size: 0.0001
    accum:
      minimum_rq: 0.8
      maximum_rq: 6.0
    expand:
      break_atr: 0.35
      displacement_atr: 1.25
      accept_closes: 2
    manip:
      min_penetration_atr: 0.05
      min_reclaim_atr: 0.05

  # Versioned confluence scoring. The Go Analysis Engine owns the live
  # calculation; these same paths remain in the generated Python projection
  # for decoding and historical compatibility only.
  confluence:
    scoring_version: v1
    v2_star_three_ratio: 0.585
    v2_star_two_ratio: 0.390
    v2_zone_quality_weight: 4.0
    v2_mad_score_weight: 2.0

  # Registry contract for every strategy approved by the semantic catalog.
  # An enabled entry without a compiled factory fails analysis-engine startup;
  # it cannot silently become a no-op, and a strategy that is not in the
  # catalog (three standalone strategies were purged) fails
  # startup too, so a stale configuration cannot revive one.
  #
  # `confluence_zone` is the one compositional exception, so this has 13
  # entries: 12 independent strategies plus Confluence Zone. Each strategy owns
  # its own threshold parsing (internal/strategy/<name>'s own parseConfig) -
  # the registry itself treats these as opaque raw parameters.
  #   minimum_strength/minimum_touches - floors zone.Zone.Strength below which
  #     a setup is not tradeable at all. (key_level carries only
  #     minimum_touches.)
  #   invalidation_buffer_atr - how far beyond the setup's edge before a
  #     confirmed close invalidates it, in ATR (0.5 elsewhere in this file).
  #   minimum_target_distance_atr - the floor below which a candidate
  #     liquidity pool is too close to entry to be a meaningful technical
  #     objective.
  #   expiry_hours - this strategy's own technical SETUP_EXPIRED window,
  #     distinct from Algo Bot's own execution-age policy.
  # Every strategy is enabled for the live Kafka opportunity stream; Algo Bot
  # consumes those events and applies execution policy before publishing V8.
  strategies:
    key_level:
      version: v4
      enabled: true
      minimum_touches: 2
      # The structure Key Level reads: profit_week is the detector contract of
      # 14–18 Sep 2026 (levels counted from fractal swings; order blocks caused
      # by a BOS), the contract of the profitable XAU week. current is the one
      # the other detectors read (wick touches counted, CHoCH order blocks).
      detector_contract: profit_week
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      # Reported target when no opposing liquidity pool exists: a fixed reward:risk
      # beyond the entry. Whether the room is enough is the execution policy's call.
      fallback_target_r: 2.0
      expiry_hours: 24.0
      # Ported from the legacy Python detector's key_level_role.py::
      # classify_key_level_role (breakout_accept_bars) — consecutive
      # closed bars that must accept beyond a level's band before its
      # role is reported BROKEN rather than plain support/resistance.
      # Legacy default (TREND_BREAKOUT_ACCEPT_BARS): 2.
      breakout_accept_bars: 2
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
    confluence_zone:
      version: v3
      enabled: true
      # Confluence Zone v3 technical contract (docs/strategies/confluence-zone-v3-technical-spec.md).
      # Every value is a tunable default validated against captures, not a claimed
      # constant; the close-strength, wick and displacement values are the ones iFVG v3 uses.
      #
      # The number of INDEPENDENT sources (not labels) that must support every price of
      # the region. Structures cut from one displacement, one gap or one inversion are one
      # source. A region must be strictly wider than max(pips x pip size, ATR multiple).
      minimum_facts: 2
      minimum_overlap_pips: 1.0
      minimum_overlap_atr: 0.05
      # The reaction: a touch and a confirming candle within this many closed candles; a
      # sweep of the region's far edge of at least this depth and a close back inside; a
      # rejecting wick and a close away from the region; or a displacement candle that
      # closes through it. Measured from the candle, never from its colour.
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      minimum_sweep_pips: 1.0
      minimum_sweep_atr: 0.05
      minimum_reclaim_atr: 0.0
      rejection_wick_ratio: 0.25
      rejection_close_strength: 0.6
      # The smallest candle (ATR) that can show a rejection: a doji inside a region shows nothing.
      minimum_rejection_range_atr: 0.25
      displacement_body_ratio: 0.6
      displacement_range_atr: 0.5
      displacement_grade_atr: 1.0
      # Geometry: the stop sits beyond the supporting structures' full extent (not just their
      # tradable slice) and the reaction's own extreme; the instrument's execution stop cap
      # is injected and a stop beyond it is refused, never tightened, and its floor is used
      # for reward:risk (the execution layer widens a tighter stop to it). The target is the nearest opposing liquidity with room.
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      minimum_reward_risk: 1.15
      expiry_hours: 12.0
    supply:
      version: v4
      enabled: true
      # A zone already touched more than this many times is spent and does not publish
      # (0 = no limit, the frozen Python publishers' behavior). 2026-10 replay, dev and
      # out-of-sample halves: supply setups on zones touched 3+ times averaged -0.06R / -0.21R,
      # fresher zones +0.04R / +0.12R (hypothetical; docs/strategies/supply.md).
      maximum_zone_touches: 2
      minimum_strength: 0.4
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
      # Also evaluate this timeframe's own supply/demand zones against the M5 bars
      # (the frozen Python publishers read the M5 zone population only). The M5
      # reaction confirmation, entry validity and stop rules are unchanged.
      higher_timeframes: [M15]
    demand:
      version: v4
      enabled: true
      # See supply. Demand setups on zones touched 3+ times averaged -0.31R / -0.39R (dev / out of
      # sample) against -0.08R / -0.22R on zones touched at most once.
      maximum_zone_touches: 2
      minimum_strength: 0.4
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
      # Also evaluate this timeframe's own supply/demand zones against the M5 bars
      # (the frozen Python publishers read the M5 zone population only). The M5
      # reaction confirmation, entry validity and stop rules are unchanged.
      higher_timeframes: [M15]
    order_block:
      version: v3
      enabled: true
      minimum_strength: 0.4
      # 2026-09-30: production saw order blocks as small as 0.03 ATR (half
      # of them under 0.5 ATR); same threshold as fvg/ifvg.
      minimum_zone_atr: 0.5
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 3.0
      entry_max_width_price: 5.0
      momentum_body_fraction: 0.6
    fvg:
      version: v3
      enabled: true
      minimum_strength: 0.4
      # 2026-09-30: XAU traded 13-pip gaps (0.36 ATR) because a big middle
      # candle lifted their strength past minimum_strength.
      minimum_gap_atr: 0.5
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # Legacy Python reaction confirmation (shared by every technique).
      reaction_lookback_bars: 3
      engulfing_minimum_range_atr: 0.5
      # Legacy Python technique validation (technique_geometry.py): price must be at
      # the zone, width capped in ATR, entry clipped to its proximal slice.
      epsilon_atr_fraction: 0.05
      maximum_zone_atr: 2.0
      entry_max_width_price: 5.0
    ifvg:
      version: v3
      enabled: true
      # iFVG v3 technical contract (docs/strategies/ifvg.md). Every value is a
      # tunable default validated against captures, not a claimed constant.
      # Distances are max(pips x pip size, ATR multiple); ATR is the Wilder ATR(14)
      # over a fixed trailing window of M5 candles. Everything is read from closed
      # M5 candles; a wick through the gap is never an inversion.
      atr_length: 14
      atr_window_bars: 140
      pivot_bars: 2
      # Inversions older than this many M5 periods are not evaluated.
      episode_lookback_bars: 48
      # The original gap: a real displacement candle between two candles whose outer
      # wicks leave a gap of at least this size (0.5 ATR is the v2 baseline).
      minimum_gap_atr: 0.5
      minimum_gap_pips: 2.0
      minimum_origin_body_atr: 0.5
      minimum_origin_body_ratio: 0.5
      # The gap must be inverted within this many periods of forming; an older gap is
      # stale structure.
      maximum_inversion_bars: 72
      # The inversion: a candle that CLOSES through the gap's far bound by the
      # buffer, with measured body, close location and displacement.
      minimum_break_pips: 1.0
      minimum_break_atr: 0.05
      minimum_inversion_body_ratio: 0.5
      minimum_inversion_close_strength: 0.6
      minimum_inversion_displacement_atr: 0.5
      displacement_grade_atr: 1.0
      # A close this far back through the whole gap means the role flip failed.
      role_flip_fail_pips: 2.0
      role_flip_fail_atr: 0.30
      # The retest: strictly after the inversion, bounded, then a rejection candle
      # within a short window; fresh only for a few candles after it. A second retest
      # of the same inversion counts only after price has left the gap again.
      retest_max_bars: 24
      retest_touch_pips: 1.0
      retest_touch_atr: 0.15
      confirmation_window_bars: 3
      confirmation_max_age_bars: 2
      rejection_close_strength: 0.6
      rejection_wick_ratio: 0.25
      rejection_body_ratio: 0.6
      max_retests_per_inversion: 2
      retest_departure_atr: 1.0
      # Geometry: the stop sits beyond min(gap far bound, retest extreme); the target
      # is the nearest credible opposing swing with room. The execution stop cap is
      # injected per instrument and a stop beyond it is refused, never tightened.
      entry_tolerance_pips: 1.0
      entry_tolerance_atr: 0.15
      maximum_entry_distance_atr: 1.5
      invalidation_buffer_atr: 0.25
      target_lookback_bars: 96
      target_swing_bars: 12
      target_swing_atr: 1.0
      minimum_target_room_atr: 0.55
      minimum_reward_risk: 1.15
      expiry_hours: 4.0
    crt:
      # v3 (docs/strategies/crt.md): a fully closed H1 candle is the range; an M5
      # candle sweeps one edge, an M5 close reclaims it, a later M5 close shifts
      # structure; the stop sits beyond the manipulation extreme and the target is
      # the opposite H1 edge. Everything is read from closed candles and related
      # across timeframes by TIME. These are tunable parameters whose defaults were
      # checked against the committed captures, not universal constants.
      version: v3
      enabled: true
      # Anchor. Baseline kept from v2. ATR is Wilder ATR(atr_length) computed over a
      # fixed trailing window so the result cannot depend on how much history loaded.
      minimum_h1_range_atr: 1.5
      atr_length: 14
      atr_window_bars: 140
      # The sweep must start inside this many H1 periods after the anchor closes (1 =
      # the next H1 candle, the CRT "manipulation" candle). A wider window is explicit.
      sweep_window_h1_periods: 1
      # Sweep threshold = max(pips x instrument pip size, ATR(M5) multiple); reclaim
      # buffer likewise. Prices are never compared in another instrument's pips.
      minimum_sweep_pips: 2.0
      minimum_sweep_atr: 0.10
      minimum_reclaim_pips: 1.0
      minimum_reclaim_atr: 0.05
      # M5 candles after the sweep candle in which a close back inside must occur
      # (v2's reclaim window, kept).
      reclaim_max_bars: 6
      # "mss" confirms on an M5 structure shift after the reclaim. "sweep_reclaim"
      # (a reclaim alone) is the historical baseline and exists for offline
      # comparison only; it is never selected here.
      confirmation_mode: mss
      structure_pivot_bars: 2
      structure_lookback_bars: 24
      mss_max_bars: 12
      minimum_mss_body_ratio: 0.5
      minimum_mss_displacement_atr: 0.5
      minimum_mss_close_strength: 0.6
      confirmation_buffer_pips: 0.0
      # A confirmation older than this many M5 candles is stale (the Algo Bot treats
      # a reaction older than structural_reaction_lookback_bars - 1 as not current).
      confirmation_max_age_bars: 2
      # Where the resting entry sits: a band centred on the reclaimed H1 edge
      # (reclaim_retest) or the retest of the swing the shift broke (mss_retest).
      # reclaim_retest is the default because it bounds the honest risk by the sweep
      # depth: on the committed captures the broken swing sits 2+ ATR above the edge
      # and mss_retest risk was 134-210 pips on every confirmed XAU episode against a
      # 70 pip cap (docs/strategies/crt.md). The structure shift is the confirmation,
      # not the entry location. entry_depth_atr only shapes mss_retest.
      entry_model: reclaim_retest
      entry_depth_atr: 0.5
      entry_tolerance_atr: 0.1
      # Stop = manipulation extreme - this ATR buffer (never tightened into the wick).
      invalidation_buffer_atr: 0.25
      # Mirrors the CRT execution profile in algo-bot strategy_catalog (min target
      # room 0.55 ATR, min reward/risk 1.15) so the detector does not publish what
      # execution policy would refuse. The instrument stop cap is injected per symbol.
      minimum_target_room_atr: 0.55
      minimum_reward_risk: 1.15
      expiry_hours: 4.0
    flip_zone:
      version: v4
      enabled: true
      invalidation_buffer_atr: 0.5
      minimum_target_distance_atr: 1.0
      expiry_hours: 24.0
      # key_level_role.classify_key_level_role: consecutive closes beyond the
      # level's band that make a break accepted (the flip's required role).
      breakout_accept_bars: 2
    trendline:
      version: v5
      enabled: true
      # The target is the nearest opposing liquidity at least this far from the entry; with none
      # there is no technical objective and nothing is published. (v3 reported twice the distance
      # from the entry to the interaction band edge, unrelated to the published stop.)
      minimum_target_distance_atr: 1.0
      # The frozen trendline_reaction (V2) gates (analysis.trendlines.*,
      # execution.technique.trendline_*): forward validation, health, staleness,
      # chop-regime quality, the live-interaction bands.
      minimum_validation_touches: 1
      chop_minimum_validation_touches: 2
      chop_require_htf_aligned: true
      require_htf_aligned: false
      reject_exhausted: true
      invalidation_buffer_atr: 0.25
      expiry_hours: 12.0
      interaction_band_atr: 0.20
      close_violation_atr: 0.15
      approach_min_distance_atr: 0.10
      maximum_bars_since_last_touch: 30
    break_retest:
      version: v3
      enabled: true
      # Break & Retest v3 technical contract (docs/strategies/break_retest.md).
      # Every value is a tunable default validated against captures, not a claimed
      # constant. Distances are max(pips x pip size, ATR multiple); ATR is the
      # Wilder ATR(14) over a fixed trailing window of M5 candles.
      atr_length: 14
      atr_window_bars: 140
      # Reference structures: fractal pivots, key levels (>= 2 same-side touches
      # within a cluster band) and two-pivot lines. A reference only uses pivots
      # confirmed strictly before the break.
      pivot_bars: 2
      reference_lookback_bars: 120
      episode_lookback_bars: 48
      level_min_touches: 2
      level_cluster_pips: 2.0
      level_cluster_atr: 0.4
      level_span_multiple: 2.0
      line_min_span_bars: 6
      line_min_slope_atr: 0.01
      line_max_slope_atr: 0.10
      line_wick_atr: 0.25
      line_max_gap_ratio: 1.5
      pre_break_bars: 3
      # Accepted break: k consecutive closes beyond the structure by the buffer,
      # with measured force on the first beyond-candle.
      breakout_accept_bars: 2
      break_buffer_pips: 1.0
      break_buffer_atr: 0.05
      minimum_break_body_ratio: 0.5
      minimum_break_close_strength: 0.6
      minimum_break_displacement_atr: 0.5
      displacement_grade_atr: 1.0
      break_fail_pips: 2.0
      break_fail_atr: 0.30
      # Retest: strictly after the acceptance, bounded, then a rejection candle
      # within a short window; fresh only for a few candles after it.
      retest_max_bars: 24
      retest_touch_pips: 1.0
      retest_touch_atr: 0.15
      confirmation_window_bars: 3
      confirmation_max_age_bars: 2
      rejection_close_strength: 0.6
      rejection_wick_ratio: 0.25
      rejection_body_ratio: 0.6
      # Geometry: stop beyond min(retest extreme, protected structure); target is
      # the nearest credible opposing swing with room.
      protected_structure: last_pivot
      entry_tolerance_pips: 1.0
      entry_tolerance_atr: 0.15
      maximum_entry_distance_atr: 1.5
      invalidation_buffer_atr: 0.25
      target_lookback_bars: 96
      target_swing_bars: 12
      target_swing_atr: 1.0
      minimum_target_room_atr: 0.55
      minimum_reward_risk: 1.15
      expiry_hours: 4.0
    fade_scalp:
      version: v3
      enabled: true
      invalidation_buffer_atr: 0.25
      # The nearest structural objective (local mean or opposing liquidity) must offer at
      # least this reward:risk; a fade with no structural objective is not published.
      minimum_reward_risk: 1.0
      expiry_hours: 4.0
      chop_edge_fraction: 0.25
      strict_premium_discount: true
    # Impulse Pullback Scalp — the Python scalp lane's discover_impulse_pullback of the
    # profitable XAU week: an M5 impulse (displacement of at least 4 ATR, body
    # dominance 0.5) with a corrective pullback (< 0.7 of the impulse body), anchored
    # to an unmitigated M5 zone or a nearby key level whose role agrees, confirmed by
    # a closed M1 bar, with the shared stop/target book. XAU only.
    impulse_pullback:
      version: v3
      enabled: true
      symbols: [XAU]
      setup_window_bars: 120
      dealing_window_bars: 120
      confirmation_window_bars: 60
      confirmation_lookback_bars: 2
      context_max_age_seconds: 420
      context_atr_bars: 14
      active_range_bars: 24
      expiry_minutes: 15
      pullback_extreme_confirm_bars: 2
      impulse_displacement_atr_multiple: 4.0
      impulse_body_dominance: 0.5
      pullback_corrective_ratio: 0.7
      level_proximity_atr_multiple: 1.0
      zone_maximum_atr_multiple: 1.5
      breakout_accept_bars: 2
      swing_fractal_n: 2
      level_cluster_atr: 0.5
      level_round_step: 5.0
      level_minimum_touches: 2
      level_max_cluster_span: 2.0
      displacement_atr_multiple: 1.5
      displacement_body_fraction: 0.6
      reward_risk_ladder: [2.0, 1.0]

  # Analysis Engine owns these market-state inputs. Depth and thresholds are
  # shared technical configuration, not execution policy.
  # Promotion thresholds describe the structure hierarchy used by Go.
  history:
    # Stored history depth per timeframe — NOT the
    # calculation lookback any one algorithm uses (§6); MarketHistory keeps
    # this much, structure/liquidity request a narrower window at read time.
    depth:
      M1: 2000
      M5: 1000
      M15: 1000
      H1: 500
      H4: 250
      D1: 150

  structure:
    version: v2
    pivot:
      # Matches Python's common swing_fractal_n=2 default (swings.py /
      # structure.py's own find_swings(df, 2, ...) call) — a pivot needs
      # this many strictly-lesser/greater bars on each side to be a raw
      # candidate. Causal: a pivot at bar i is only CONFIRMED once
      # right_bars additional bars have closed.
      left_bars: 2
      right_bars: 2
    swing:
      # A confirmed pivot whose excursion (in ATR) is below this floor is
      # not promoted to a Swing at all — not every fractal is meaningful
      # not every fractal is meaningful.
      minimum_excursion_atr: 0.5
      promotion:
        internal_atr: 1.0
        intermediate_atr: 2.0
        major_atr: 3.5
    equal_level:
      # Matches technique_geometry.py's epsilon() — 0.05 ATR — already the
      # live, tested "same price level" tolerance for zone/level identity.
      tolerance_atr: 0.05
    break:
      # Minimum close penetration beyond a level before invalidation.
      minimum_penetration_atr: 0.5
      # Matches zones.py::displacement()'s k=1.5 / body_frac=0.55 exactly.
      displacement_range_atr: 1.5
      displacement_body_dominance: 0.55
      # Number of bars in which a sweep may be reclaimed.
      sweep_reclaim_bars: 6
      failed_break_reclaim_bars: 3

  liquidity:
    version: v1
    # Same epsilon as structure.equal_level.tolerance_atr — one canonical
    # "same price level" tolerance across structure and liquidity, not two
    # independently-drifting ones.
    equal_level_tolerance_atr: 0.05
    pool_minimum_touches: 2
    sweep_reclaim_bars: 6

  trendlines:
    # V2 keeps A/B anchors immutable, requires a later causal validation, and
    # turns this band into an interaction watch rather than an automatic fill.
    version: v2
    validation_touch_tolerance_atr: 0.30
    interaction_band_atr: 0.20
    invalidation_penetration_atr: 0.50
    close_violation_atr: 0.15
    approach_min_distance_atr: 0.10
    minimum_validation_touches: 1
    minimum_validation_touch_spacing_bars: 5
    validation_reaction_bars: 2
    minimum_validation_favorable_excursion_atr: 0.10
    maximum_wick_violations: 2
    exhaustion_validation_touches: 4
    # Trendline geometry defaults used by the structural analysis pipeline.
    minimum_slope_atr: 0.02
    maximum_slope_atr: 0.15
    minimum_touch_spacing_bars: 3
    minimum_span_bars: 20
    dedup_value_atr: 0.5
    dedup_slope_percent: 0.2

  techniques:
    # Canonical zone lifecycle inputs shared by the Go zone domain and the
    # structural validator and opportunity lifecycle.
    retest_max_touches: 30
    invalidation_tolerance_atr: 0.5
    sweep_reclaim_bars: 6
    max_break_episodes: 2

  zone_relevance:
    immediate_atr: 0.25
    nearby_atr: 1.25
    remote_atr: 3.0

  flip_zone:
    accept_bars: 2
    band_body_fraction: 0.5

  # Go's arbitration groups same-structure opportunities into one thesis
  # (the go_thesis_id Algo Bot consumes) and publishes winner/suppressed/
  # conflict_held decisions as provenance telemetry. It never decides what
  # trades: Algo Bot's execution cycle does, after quote, freshness and risk
  # admission. A same-tier opposite-direction candidate must trail the top one
  # by conflict_margin_quality of Quality.Overall ([0,1]) to count as decisively
  # weaker in this telemetry.
  #
  # in_play_atr bounds the candidates watched around the current price. When
  # any candidate is inside its entry zone, only those executable-now
  # candidates are arbitrated; nearby resting zones are suppressed and cannot
  # create a false BUY-vs-SELL conflict.
  arbitration:
    # false: Quality.Overall orders nothing and settles no conflict here (candidate id order;
    # every opposite thesis is a conflict unless the structural bias settles it). Algo Bot's own
    # auto-algo.yml actionability.scanner_gates.quality_ranking is kept equal so the telemetry
    # describes what executes. docs/strategies/arbitration-impact-report.md.
    quality_ranking: false
    conflict_margin_quality: 0.15
    in_play_atr: 1.0

  zones:
    version: v1

  # Key-level clustering defaults used by the structural analysis pipeline.
  key_levels:
    # key_levels()'s level_cluster_atr.
    cluster_atr: 0.5
    # key_levels()'s round_step.
    round_step: 5.0
    # key_levels()'s min_touches.
    minimum_touches: 2
    # key_levels()'s max_cluster_span_multiple.
    maximum_cluster_span_multiple: 2.0
  # ATR-normalized velocity thresholds for the price-only momentum read
  # (internal/momentum, a port of app/analysis/momentum.py::momentum_state):
  # v = (close[t] - close[t-n]) / (n * ATR14), bull at v >= velocity_bull_threshold,
  # bear at v <= velocity_bear_threshold. Values equal the Python schema
  # defaults (analysis.momentum.*) so both sides classify identically.
  momentum:
    velocity_lookback: 8
    velocity_bull_threshold: 0.15
    velocity_bear_threshold: -0.15

  # Fibonacci and dealing-range geometry defaults.
  fibonacci:
    # nearest_fib()'s epsilon_atr.
    epsilon_atr: 0.15
    # Technical confluence weight for a confirmed fib touch.
    confluence_weight: 2.5
    # fib_zone_label()'s deep_discount/deep_premium position thresholds —
    # not a coincidence that these equal the 38.2%/61.8% retracement
    # ratios themselves.
    deep_discount: 0.382
    deep_premium: 0.618
    # dealing_range()'s own eq_band=0.10 default, already halved — see
    # internal/fib.Config.EqHalfBand's own comment on why it's stored
    # pre-halved.
    eq_half_band: 0.05

  # §7: zones.merge_max_width / zones.confluence.merge_gap_price (price-
  # absolute, not ATR-relative — see zones.merge_overlap/max_merged_zone_atr
  # above for those) are REMOVED from here, not just left unused. Investigated
  # live: app/core/instrument_geometry.py::merge_max_width(symbol)/
  # merge_gap_price(symbol) already resolve through instrument_runtime_view
  # (analysis_runtime(symbol)), and every live instrument (instruments.yml,
  # each pack or instrument override) already declares its own
  # price_scale.zone_merge_gap_price/zone_merge_max_width — so this was not
  # live-wrong today, but the old global value here (1.0 / 6.0) was byte-
  # identical to XAU's own pack number, meaning a new instrument that forgot
  # to declare these two leaves would have silently inherited XAU's
  # dollar-scale geometry, exactly the failure mode §7 forbids by
  # construction. instruments.yml is the one owner now; each pack/instrument
  # must declare both explicitly (schema should make them required, not
  # defaulted, once a real loader exists).

  # --- market-data inputs retained in the analysis category ---
  calendar:
    currencies:
      - USD
      - EUR
      - GBP
      - JPY
    enabled: true
    event_guard_hours: 4.0
    feed_nextweek: https://nfs.faireconomy.media/ff_calendar_nextweek.json
    feed_thisweek: https://nfs.faireconomy.media/ff_calendar_thisweek.json
    news_brief_hour: 7
    news_guard_block: false
    oil_keywords:
      - crude oil inventories
      - opec
      - cushing
      - api weekly crude
    user_agent: apexvoid-trading-bot/1.0 (+contact)

  # §4/§5: ctrader_feed.symbol/timeframes REMOVED. Feed subscription derives
  # from instruments.yml: subscribe every instrument with rollout == live,
  # using its own broker_symbol and timeframes list — never a second,
  # independent symbol/timeframe list. The single XAUUSD/[M1,M5,M15,H1]
  # this held is exactly instruments.yml's XAU entry (broker_symbol XAUUSD
  # via the aliases list, timeframes from its pack) — a real duplicate, not
  # a distinct concept.

  scanner:
    # Symbols derive from instruments.yml (rollout == live); there is no second list.
    window: 500

  sessions:
    asia_start: 22
    london_start: 7
    ny_start: 13
    # Trading-day boundary for PDH/PDL.
    daily_rollover_utc_hour: 21
    # The hours above are the northern-summer UTC values, kept for the scanner and
    # Algo Bot. The Analysis Engine places the same boundaries on real market
    # clocks, so its session windows and trading-day rollover follow daylight
    # saving: Asia opens at 07:00 Tokyo (22:00 UTC, no DST), London at 08:00 London
    # (07:00 UTC in BST, 08:00 in GMT), New York at 09:00 New York (13:00 UTC in EDT,
    # 14:00 in EST) and the FX trading day rolls over at 17:00 New York (21:00 UTC
    # in EDT, 22:00 in EST). In northern summer these equal the integers above.
    calendar:
      asia: {zone: Asia/Tokyo, local_hour: 7}
      london: {zone: Europe/London, local_hour: 8}
      ny: {zone: America/New_York, local_hour: 9}
      rollover: {zone: America/New_York, local_hour: 17}

  spot:
    maximum_age_seconds: 5

  watcher:
    interval_seconds: 120
    ctrader_stale_seconds: 180
