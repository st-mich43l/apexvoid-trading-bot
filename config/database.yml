# Non-secret database topology — owned exclusively here. Password/full DSN
# remain secret ENV inputs (POSTGRES_PASSWORD / DATABASE_URL). The current
# deployment keeps the connection as one opaque DATABASE_URL secret (no
# separate non-secret
# host/port fields exist in the Python model yet). The values below
# document the real current topology (docker-compose.yml's own `postgres`
# service name/POSTGRES_DB/POSTGRES_USER defaults).
database:
  postgres:
    host: postgres
    port: 5432
    database: signals
    username: apexvoid
