# Auto trading orchestration/policy — owned exclusively here. Answers
# "should ApexVoid act on it?" (analysis.yml already answered "what
# opportunity exists?" — that boundary is preserved deliberately, per the
# new architecture's own §5). Market-analysis formulas never belong here.
#
# Owns the automatic execution-policy groups: actionability, lifecycle, risk,
# strategies, and scanner enablement.
auto_algo:
  enabled: true
  dry_run: false
  strategy_match_enabled: true


  actionability:
    entry_location:
      # Enforce: block entries at premium BUYs / discount SELLs (and extremes).
      # Pairs with execution.activation.mode=enforce.
      mode: enforce
      reversal:
        buy_maximum_position: 0.50
        sell_minimum_position: 0.50
      range_reversion:
        buy_maximum_position: 0.40
        sell_minimum_position: 0.60
      trend_pullback:
        buy_maximum_position: 0.70
        sell_minimum_position: 0.30
    gates:
      min_confluence: 2
      news_guard_minutes: 30
      event_cluster_guard_enabled: false
      event_cluster_span_hours: 48
      event_cluster_guard_minutes: 180
      proximal_band_atr: 0.5
    target_room:
      barrier_buffer_atr: 0.5
      minimum_capped_target_pips: 15.0
    scanner_gates:
      # false: no quality score orders intents or settles a direction conflict (the order is
      # executable, freshest confirmation, id; opposite executable intents are held unless exactly
      # one agrees with the higher-timeframe bias). The scores did not predict outcomes
      # (docs/execution.md (same-thesis arbitration)). true restores the quality order and the margin.
      quality_ranking: false
      conflict_margin_quality: 0.15

  lifecycle:
    candidate:
      storage_ttl_seconds: 604800
    retest:
      trigger_validity_bars: 2

  risk:
    position_limits:
      same_direction_stack_size_fraction: 0.6
    sizing:
      risk_pct: 2.0
      equity_table_version: owner_equity_v1
      mode: equity_table
      one_sided_range_risk_multiplier: 0.5
      post_impulse_risk_multiplier: 0.5
      range_max_risk_multiplier: 1.5
  strategies:
    technique:
      confluence:
        enabled: true
      sd:
        enabled: true
      ob:
        enabled: true
      fvg:
        enabled: true
        # Proximal entry width for FVG/iFVG/imbalance (price). Full gap stays
        # structural; every strategy clips tradeable entry to this band.
        entry_max_width_price: 5.0
      ifvg:
        enabled: true
      crt:
        enabled: true
      # XAU scalp strategies (analysis.strategies.* in analysis.yml carries the symbol scope).
      round_number:
        enabled: true
      asia_range:
        enabled: true
      shock_retest:
        enabled: true
    zone:
      demand:
        enabled: true
      supply:
        enabled: true
      flip:
        enabled: true
    # `scalping` is a sibling of `technique`, not nested under it — matching
    # the categorized strategy shape exactly
    # (a prior draft of this file nested it under `technique` by mistake;
    # caught by the parity-check script comparing every leaf against the
    # The categorized configuration remains the source of truth.
    scalping:
      # M1-event-driven scalping: M5 owns setup structure; closed M1 owns
      # execution confirmation. Publish TradePlan when activation + risk pass.
      # Requires auto_algo.enabled=true. XAU hosts M1 scalping even
      # when technique uses structure fixed_rr; FX fixed_rr books stay excluded
      # in app.scalping.context._scalping_symbols.
      mode: live
      location:
        # Impulse Pullback Scalp: a BUY pullback in the lower 60% of the dealing
        # range, a SELL in the upper 60%.
        pullback_buy_maximum_position: 0.60
        pullback_sell_minimum_position: 0.40
      activation:
        maximum_chase_pips: 40
        maximum_chase_stop_fraction: 0.30
      target:
        minimum_net_target_pips: 10
      stop:
        minimum_pips: 12
        maximum_pips: 45
        buffer_atr: 0.10
        buffer_m1_atr_multiple: 1.2
        buffer_minimum_spread_multiple: 1.5
      policy:
        minimum_reward_risk: 1.10
        maximum_spread_pips: 5
      risk:
        risk_percent_per_trade: 0.5
        sizing_mode: equity_table
    breakout:
      break_retest_enabled: true
    mapped_zone:
      enabled: false
    range_reversion:
      # §8/§9: newly surfaced (StrategiesRangeReversionConfig.enabled
      # Python schema default, unchanged value True) — same
      # only-reachable-via-demo-override gap as risk.exposure above.
      enabled: true
    reaction:
      demand:
        enabled: true
      enabled: true
      key_level:
        enabled: true
      scale_enabled: true
      supply:
        enabled: true
      trendline:
        enabled: true
        # optional per-strategy tightenings, omitted = inherit analysis.trendlines
        # maximum_bars_since_last_touch:
        # maximum_fit_error_atr:
        # require_htf_aligned: false
        # require_killzone: false
        # minimum_grade:
    trend:
      enabled: true
