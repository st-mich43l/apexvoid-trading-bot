# ApexVoid root configuration entrypoint (Configuration V3).
#
# All runtimes (analysis-engine / algo-bot / ctrader-engine) start here.
# APEXVOID_CONFIG_FILE must point at this file — see docs/configuration.md.
#
# This is Stage C1 of the migration in
# docs/configuration-v3-migration-audit.md: the categorized files below are
# populated with today's real effective values (mechanically split out of
# the single config/trading-bot.yml this replaces), not a redesign. No
# runtime yet reads this file — config/trading-bot.yml + the generated
# ResolvedRuntimeManifest remain the live authority until Stage C3/C4/C5
# (direct per-language readers) land and cross-language parity is proven.
# Do not add a setting here directly; add it to the owning category file
# and list it below.
version: 3

includes:
  - runtime.yml
  - transport.yml
  - database.yml
  - instruments.yml
  - analysis.yml
  - auto-algo.yml
  - manual-algo.yml
  - execution.yml
  - telegram.yml
  - journal.yml
  - environments/production.yml
