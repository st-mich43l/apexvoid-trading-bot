# ApexVoid root configuration entrypoint (Configuration V3).
#
# All runtimes (analysis-engine / algo-bot / ctrader-engine) start here.
# APEXVOID_CONFIG_FILE must point at this file — see docs/configuration.md.
#
# The categorized files below are the current source for service
# configuration. Do not add a setting here directly; add it to the owning
# category file and list it below.
version: 3

includes:
  - runtime.yml
  - transport.yml
  - database.yml
  - instruments.yml
  - analysis.yml
  - auto-algo.yml
  - manual-algo.yml
  - execution.yml
  - telegram.yml
  - journal.yml
  - environments/production.yml
